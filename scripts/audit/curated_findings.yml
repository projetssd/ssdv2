# Constats relus manuellement, complémentaires aux contrôles structurels.
#
# Trois sections :
#   findings      constats confirmés après relecture (résolus par `needle`)
#   checks        points à vérifier, sans conclusion automatique
#   acknowledged  écarts volontaires, justifiés, exclus des compteurs
#
# Une entrée `findings` dont le `needle` disparaît du fichier `path` est signalée
# comme obsolète dans apps-alignment.json (clé `stale_curated`) au lieu d'être
# comptée : un audit sur une autre branche n'hérite pas de constats périmés.
#
# Les familles purement structurelles (GENLOG, FIXEDSECRET, PROMPTECHO, TZ,
# NETWORKCLEAN, PARTIALDELETE, CROSSAPPDELETE, WEBHOSTPORT, ...) sont calculées
# par le script et ne doivent pas être dupliquées ici.

findings:
- app: authelia
  code: ROTATESECRET
  axis: cycle
  severity: P1
  path: includes/dockerapps/pretasks/authelia.yml
  needle: Create new hashed encryption_key
  detail: Clé de chiffrement du stockage et secrets de session régénérés sans garde à chaque installation ; configuration réécrite malgré la base conservée
- app: authelia
  code: SECRETFILEMODE
  axis: permissions
  severity: P2
  path: includes/dockerapps/pretasks/authelia.yml
  needle: 'dest:'
  detail: Templates de configuration contenant des secrets écrits sans mode restrictif explicite ; permissions dépendantes du contexte
- app: stremthru
  code: ORPHANDATA
  axis: cycle
  severity: P2
  path: includes/dockerapps/pretasks/stremio/stremthru_base.yml
  needle: stremthru-postgres:/var/lib
  detail: Les bind mounts stremthru-postgres et stremthru-redis sont hors du dossier applicatif et aucun nettoyage dédié ne les retire en suppression complète
- app: streamfusion
  code: ORPHANDATA
  axis: cycle
  severity: P2
  path: includes/dockerapps/pretasks/streamfusion.yml
  needle: streamfusion-secrets
  detail: Le dossier streamfusion-secrets est hors du dossier applicatif ; la branche de suppression ne le retire pas en mode complet
- app: webui
  code: ORPHANDATA
  axis: cycle
  severity: P2
  path: includes/functions.sh
  needle: '  ssd-backend|ssd-frontend|saison-frontend)'
  detail: Le nettoyage projet-ssd vise les noms des compagnons, alors que l’identifiant catalogue est webui ; vérifier et aligner le nettoyage des données hors dossier webui
- app: coolify
  code: KEYCLEAN
  axis: cycle
  severity: P2
  path: includes/dockerapps/posttasks/coolify.yml
  needle: '>> ~/.ssh/authorized_keys'
  detail: Ajout de clé SSH hors dossier applicatif sans nettoyage ciblé à la suppression et sans déduplication à la réinstallation
- app: coolify
  code: ROTATESECRET
  axis: cycle
  severity: P1
  path: includes/dockerapps/vars/coolify.yml
  needle: 'APP_KEY:'
  detail: Les secrets sont générés par lookup(pipe) sans lecture de valeurs persistantes ; la posttask réécrit .env à chaque installation, malgré les données conservées
- app: homarr
  code: SECRETFILEMODE
  axis: permissions
  severity: P2
  path: includes/dockerapps/pretasks/homarr.yml
  needle: openssl rand -hex 32 >
  detail: Clé générée dans un dossier 0755 sans umask restrictif ni chmod/mode explicite sur le fichier ; permissions dépendantes de l’environnement
- app: navidrome
  code: SUBDIRUID
  axis: permissions
  severity: P1
  path: includes/dockerapps/vars/navidrome.yml
  needle: /config:/data
  detail: 'Conteneur lancé sous MYUID:MYGID, bind du sous-dossier config sans préparation de ce sous-dossier : Docker peut le créer root et empêcher l’écriture au premier démarrage'
- app: mattermost
  code: WORLDWRITE
  axis: permissions
  severity: P2
  path: includes/dockerapps/posttasks/mattermost_post.yml
  needle: chmod -R 777
  detail: Dossier applicatif rendu récursivement accessible en écriture à tous les utilisateurs
- app: grabb2rss
  code: IGNOREDOPTION
  axis: deploiement
  severity: P2
  path: includes/dockerapps/vars/grabb2rss.yml
  needle: 'healthcheck:'
  detail: healthcheck placé à la racine des variables et non dans specific_docker_info ; le playbook générique ne le transmet pas à Docker
- app: alfred
  code: IGNOREDOPTION
  axis: minimalisme
  severity: P3
  path: includes/dockerapps/vars/alfred.yml
  needle: 'hostname:'
  detail: hostname placé à la racine ; le playbook générique ne le transmet pas au conteneur
- app: aiostreams
  code: ROTATESECRET
  axis: cycle
  severity: P1
  path: includes/dockerapps/pretasks/aiostreams.yml
  needle: openssl rand -hex 32
  detail: Secret régénéré sans garde ni relecture persistante à chaque installation ; stabilité des sessions ou données protégées non garantie
- app: firefoxsyncserver
  code: ROTATESECRET
  axis: cycle
  severity: P1
  path: includes/dockerapps/pretasks/firefoxsyncserver.yml
  needle: 'secret_connect:'
  detail: Secret régénéré sans garde ni relecture persistante à chaque installation ; stabilité des sessions ou données protégées non garantie
- app: immich
  code: ROTATESECRET
  axis: cycle
  severity: P1
  path: includes/dockerapps/pretasks/immich.yml
  needle: random_string_output
  detail: 'Mot de passe PostgreSQL/immich généré à chaque installation sans relecture persistante : une réinstallation sur des données conservées peut désynchroniser la base de son mot de passe'
- app: rtorrentvpn
  code: MANUALSTEP
  axis: assistance
  severity: P2
  path: includes/dockerapps/posttasks/rtorrentvpn.yml
  needle: Transférer maintenant
  detail: Import VPN demandé via FTP/SSH, sans assistant de transfert ni génération automatisée
- app: pterodactyl
  code: MANUALSTEP
  axis: assistance
  severity: P2
  path: includes/dockerapps/posttasks/pterodactyl.yml
  needle: php artisan p:user:mak
  detail: Création du compte administrateur laissée à une commande docker exec manuelle
- app: guacamole
  code: MANUALSTEP
  axis: assistance
  severity: P2
  path: includes/dockerapps/posttasks/guacamole.yml
  needle: initialisée manuellement
  detail: En cas d'échec du schéma, poursuite avec demande d'initialisation manuelle plutôt qu'assistance ou échec exploitable
checks:
- app: plexautolanguages
  axis: traefik
  path: includes/dockerapps/vars/plexautolanguages.yml
  needle: 'intport: ''80'''
  detail: Vérifier que cet addon Plex fournit une interface HTTP sur 80 ; sinon désactiver les labels génériques
- app: kasm
  axis: traefik
  path: includes/dockerapps/vars/kasm.yml
  needle: 'intport: ''443'''
  detail: Port 443 sans schéma HTTPS explicite du service générique ; vérifier le protocole écouté par l’image
- app: yourls
  axis: traefik
  path: includes/dockerapps/vars/yourls.yml
  needle: 'intport: ''8080'''
  detail: Vérifier le port HTTP 8080 de l’image yourls non épinglée
- app: qflood
  axis: traefik
  path: includes/dockerapps/vars/qflood.yml
  needle: '''3000:3000'''
  detail: Un second port 3000 est publié avec intport 8080 ; qualifier les deux interfaces avant de décider du routage
- app: webdav
  axis: traefik
  path: includes/dockerapps/vars/webdav.yml
  needle: 'loadbalancer.server.port:'
  detail: Confirmer le port effectif 80 ou 8080 et le comportement TLS
- app: paperless
  axis: persistance
  path: includes/dockerapps/vars/paperless.yml
  needle: /usr/src/paperless/consume
  detail: data, media, export et consume montent le même dossier hôte ; confirmer les effets sur l’import et séparer les données par fonction
- app: vikunja
  axis: persistance
  path: includes/dockerapps/pretasks/vikunja.yml
  needle: /var/lib/postgresql"
  detail: 'Vérifier le répertoire de données effectif de postgres:16-alpine : le bind cible le parent /var/lib/postgresql'
- app: sismicsreader
  axis: persistance
  path: includes/dockerapps/templates/generique/hsqldb.yml
  needle: 'image:'
  detail: Vérifier l’image HSQLDB et ses répertoires persistants avant de certifier la réinitialisation
- app: ssdv2-relay
  axis: assistance
  path: includes/dockerapps/pretasks/ssdv2-relay.yml
  needle: Worker Cloudflare reste déployé manuellement
  detail: 'Worker externe déployé manuellement : documenter cette frontière d’automatisation et vérifier si une automatisation avec les accès SSDV2 est possible'
- app: streamfusion
  axis: assistance
  path: includes/dockerapps/pretasks/streamfusion.yml
  needle: Entre ta ADMIN_KEY
  detail: Clé ADMIN interne demandée alors que les autres secrets sont générés ; confirmer la nécessité d’un choix utilisateur ou générer une valeur persistante
- app: seerrcatalog
  axis: assistance
  path: includes/dockerapps/pretasks/seerrcatalog.yml
  needle: Entrez une clé de votre choix
  detail: Clé interne demandée à l’utilisateur ; confirmer si une génération persistante suffit
- app: webdav
  axis: traefik
  path: includes/dockerapps/vars/webdav.yml
  needle: 'loadbalancer.server.port:'
  detail: 'Le service Traefik pointe 8080 : confirmer le port réellement écouté par l''image webdav'
acknowledged:
- app: sffs
  code: PARTIALDELETE
  target: sffs-secrets
  reason: 'Retrait documenté dans functions.sh : les secrets sffs contiennent la configuration StreamFusion liée à la clé d''API supprimée juste avant, et une réinstallation les régénère. Le cache persistant sffs-cache reste, lui, protégé par DELETE=1.'
- app: airdcpp
  code: DEBUGSECRET
  target: dpasswd
  reason: 'Identifiants de démonstration fournis par l''image et affichés pour le premier accès : ils ne protègent aucune donnée utilisateur et l''utilisateur doit les voir. À remplacer par un compte personnel.'
- app: bookstack
  code: DEBUGSECRET
  target: dpasswd
  reason: 'Identifiants de démonstration fournis par l''image et affichés pour le premier accès : ils ne protègent aucune donnée utilisateur et l''utilisateur doit les voir. À remplacer par un compte personnel.'
