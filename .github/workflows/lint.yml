name: Lint

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  shellcheck:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: ShellCheck (erreurs)
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck -S error "${files[@]}"
      - name: ShellCheck (warnings, hors bruit gettext accepté)
        run: |
          mapfile -t files < <(git ls-files '*.sh')
          shellcheck -S warning -e SC2046,SC2027 "${files[@]}"

  catalogue:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validation du catalogue
        run: python3 includes/config/scripts/validate_catalogue.py
      - name: Validation des facts Ansible (inject_facts_as_vars=False)
        run: python3 includes/config/scripts/validate_ansible_facts.py

  python:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: py_compile
        run: |
          mapfile -t files < <(git ls-files '*.py')
          if [ "${#files[@]}" -gt 0 ]; then
            python -m py_compile "${files[@]}"
          fi
      - name: Dépendances du moteur d'audit
        run: python3 -m pip install --quiet pyyaml
      - name: Tests du moteur d'audit add-app
        run: python3 tests/test_apps_alignment.py

  bats:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - name: Install bats et jq
        run: sudo apt-get update && sudo apt-get install -y bats jq
      - name: Tests unitaires
        run: bats tests/bats

  ansible-syntax:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ansible
        # Version epinglee : ansible 14 casse l'installation des roles/collections
        # du job (run 39632808452). Aligner sur la version locale validee.
        run: pip install 'ansible==11.13.0'
      - name: Install roles and collections
        run: |
          retry() {
            for i in 1 2 3 4 5; do
              "$@" && return 0
              echo "Tentative ${i} échouée, nouvel essai dans 15s..."; sleep 15
            done
            return 1
          }
          retry ansible-galaxy role install kwoodson.yedit
          retry ansible-galaxy collection install community.general community.docker
          test -d "${HOME}/.ansible/roles/kwoodson.yedit"
      - name: ansible-playbook --syntax-check
        run: |
          for f in includes/config/playbooks/*.yml includes/dockerapps/vars/generique.yml; do
            echo "syntax-check: $f"
            ansible-playbook --syntax-check "$f"
          done
      - name: Tests StreamFusion sur données fictives
        run: |
          export ANSIBLE_PLAYBOOK="$(command -v ansible-playbook)"
          python3 tests/test_streamfusion.py
      - name: Tests Relay et Proxy sur données fictives
        run: |
          export ANSIBLE_PLAYBOOK="$(command -v ansible-playbook)"
          test -x "$ANSIBLE_PLAYBOOK"
          python3 tests/test_relay_proxy.py
      - name: Tests d'hygiène des secrets
        run: |
          export ANSIBLE_PLAYBOOK="$(command -v ansible-playbook)"
          python3 tests/test_secret_hygiene.py

  yaml:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.x'
      - name: Validate dockerapps YAML
        run: |
          pip install pyyaml
          python3 - <<'PY'
          import glob, yaml, sys
          # Aucune exclusion : un fichier YAML invalide doit être signalé, même
          # s'il n'est pas encore référencé par un hook.
          failed = []
          files = glob.glob('includes/dockerapps/**/*.yml', recursive=True)
          for f in files:
              try:
                  yaml.safe_load(open(f).read())
              except Exception as exc:
                  failed.append((f, str(exc).splitlines()[0]))
          if failed:
              for f, e in failed:
                  print(f"YAML invalide: {f} -> {e}")
              sys.exit(1)
          # Garde-fou ciblé : ce fichier était exclu pour une erreur de guillemet,
          # pas pour du Jinja. Il doit rester lisible.
          tasks = yaml.safe_load(open(
              'includes/dockerapps/pretasks/stremio/stremio_base.yml').read())
          if not isinstance(tasks, list) or not tasks:
              sys.exit('stremio_base.yml ne contient aucune tâche lisible')
          print(f"YAML OK ({len(files)} fichiers, stremio_base.yml inclus)")
          PY

  ansible-lint:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - name: Install ansible-lint
        run: pip install 'ansible-lint==26.10.1'
      - name: Install roles and collections
        run: |
          ansible-galaxy role install kwoodson.yedit
          ansible-galaxy collection install community.general community.docker
      - name: ansible-lint
        run: ansible-lint includes/config/playbooks includes/dockerapps/vars/generique.yml
