---
- name: Configure Traefik logrotate
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Traefik
      ansible.builtin.template:
        src: "{{ settings.source }}/includes/config/playbooks/templates/traefik.j2"
        dest: /etc/logrotate.d/traefik
        mode: "0644"
        force: true
