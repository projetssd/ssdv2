---
- hosts: localhost
  gather_facts: false
  vars_files:
    - "{{ playbook_dir }}/../../dockerapps/templates/generique/generique.yml"

  tasks:
  - name: "Remove DNS Record on CloudFlare"
    include_tasks: "{{ settings.source }}/includes/config/roles/cloudflare/tasks/uninstall.yml"
    vars:
      subdomain: "{{sub[pgrole][pgrole] if sub_enabled else pgrole}}"
    when: cloudflare_enabled

  - name: "Remove extra DNS Record on CloudFlare"
    include_tasks: "{{ settings.source }}/includes/config/roles/cloudflare/tasks/uninstall.yml"
    vars:
      subdomain: "{{ extra_subdomain }}"
    when: cloudflare_enabled and (extra_subdomain | default('') | length > 0)
