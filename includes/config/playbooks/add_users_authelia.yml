---
- name: Add users to Authelia
  hosts: all
  vars_prompt:

    - name: username
      prompt: Nom
      private: false

    - name: password
      prompt: Password
      private: true

    - name: mail
      prompt: Mail
      private: false

  tasks:

    - name: Create new hashed password
      ansible.builtin.shell: |
        set -o pipefail
        docker run --rm authelia/authelia:latest authelia hash-password "$AUTHELIA_PASSWORD" | cut -d: -f2 | sed 's/ //g'
      args:
        executable: /bin/bash
      environment:
        AUTHELIA_PASSWORD: "{{ password }}"
      register: password_hash
      changed_when: false
      no_log: true

    - name: Modify users.yml
      ansible.builtin.blockinfile:
        marker: "##{{ username }}##"
        path: "{{ settings.storage }}/docker/{{ user.name }}/authelia/users.yml"
        block: |
          "{{ username }}":
            disabled: false
            displayname: "{{ username }}"
            password: "{{ password_hash.stdout }}"
            email: "{{ mail }}"
            groups:
              - admins

    - name: Print a message
      ansible.builtin.debug:
        msg: 'Logging authelia in as {{ username }}'
