---
- name: Read a variable
  hosts: localhost
  gather_facts: false


  tasks:
    - name: Split variables
      ansible.builtin.set_fact:
        myindexes: "{{ myvar | split('.') }}"

    - name: Initialize result
      ansible.builtin.set_fact:
        myresult: "{{ vars }}"

    - name: Loop block
      block:
        - name: Set variables
          ansible.builtin.set_fact:
            myresult: "{{ myresult[item] }}"
          loop: "{{ myindexes }}"

      rescue:
        - name: Set empty var
          ansible.builtin.set_fact:
            myresult: "notfound"

    # Écriture dans un fichier plutôt qu'un parsing de stdout : préserve
    # espaces, guillemets et retours à la ligne de la valeur.
    - name: Write result to temporary file
      ansible.builtin.copy:
        content: "{{ myresult }}"
        dest: "{{ tempfile }}"
        mode: '0600'
      when: tempfile is defined and (tempfile | length > 0)

    - name: Debug
      ansible.builtin.debug:
        msg: "##RESULT##{{ myresult }}##RESULT##"
