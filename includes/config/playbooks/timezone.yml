---
- name: Set timezone
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Set timezone to Europe/Paris
      community.general.timezone:
        name: Europe/Paris
    - name: Create /etc/localtime symlink
      ansible.builtin.file:
        path: /etc/localtime
        state: link
        src: /usr/share/zoneinfo/Europe/Paris
