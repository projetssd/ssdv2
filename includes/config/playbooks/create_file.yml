---
- name: Create file
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Make sure file is present
      ansible.builtin.file:
        path: "{{ FILE }}"
        state: touch
        mode: "0664"
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'MYGIDNAME') }}"
