---
- name: Create directory
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: "Make sure directory is present: {{ DIRECTORY }}"
      ansible.builtin.file:
        path: "{{ DIRECTORY }}"
        state: directory
        mode: "0775"
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'MYGIDNAME') }}"
