---
- name: Configure logrotate
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: Logrotate
      ansible.builtin.template:
        src: "{{ settings.source }}/includes/config/playbooks/templates/logrotate.j2"
        dest: /etc/logrotate.d/ansible
        mode: "0644"
        force: true
