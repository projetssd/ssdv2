---
- name: Change file owner
  hosts: localhost
  gather_facts: false
  become: true
  tasks:
    - name: "Change owner of file: {{ FILE }}"
      ansible.builtin.file:
        path: "{{ FILE }}"
        state: file
        owner: "{{ lookup('env', 'USER') }}"
        group: "{{ lookup('env', 'MYGIDNAME') }}"
