---

- name: Set 'record' variable
  set_fact:
    record: "{{ (subdomain == user.domain) | ternary(user.domain,subdomain + '.' + user.domain) }}"

- name: Set DNS Record
  cloudflare_dns:
    account_api_token: "{{ cloudflare.api }}"
    account_email: "{{ cloudflare.login }}"
    zone: "{{ user.domain }}"
    state: present
    solo: true
    proxied: yes
    type: A
    value: "{{ network.ipv4 }}"
    record: "{{ subdomain }}"

- name: Display DNS Record
  debug:
    msg: "DNS Record for '{{ record }}' set to '{{ network.ipv4 }}'."

# Registre des sous-domaines DNS créés pour l'application : permet à la
# suppression de retirer tous les enregistrements, y compris les sous-domaines
# additionnels (ex. nextcloud -> collabora/office, pterodactyl -> wings).
- name: Ensure DNS registry directory exists
  file:
    path: "{{ settings.storage }}/conf"
    state: directory
    mode: '0775'
  when: pgrole is defined and settings.storage is defined

- name: Record DNS subdomain in app registry
  lineinfile:
    path: "{{ settings.storage }}/conf/{{ pgrole }}.dns"
    line: "{{ subdomain }}"
    create: yes
    mode: '0664'
  when: pgrole is defined and subdomain is defined

