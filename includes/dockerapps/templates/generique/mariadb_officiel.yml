---
- name: Create {{pgrole}}-net network
  docker_network:
    name: '{{pgrole}}-net'
    state: present

# Le registre peut renvoyer une limite de débit transitoire (toomanyrequests).
# On réessaie le pull ; l'image n'est téléchargée que si elle est absente.
- name: 'Récupérer l''image MariaDB (résiste aux limites de débit du registre)'
  community.docker.docker_image:
    name: 'mariadb:10.6.4'
    source: pull
  register: mariadb_pull
  until: mariadb_pull is not failed
  retries: 12
  delay: 15

- name: 'Deploying db-{{pgrole}}'
  docker_container:
    keep_volumes: false
    labels:
      ssdv2.app: "{{pgrole}}"
    name: 'db-{{pgrole}}'
    recreate: true
    image: 'mariadb:10.6.4'
    pull: false
    volumes:
      - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{pgrole}}/db-{{pgrole}}/data:/var/lib/mysql"
      - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{pgrole}}/db-{{pgrole}}/init:/docker-entrypoint-initdb.d"
      - '/etc/localtime:/etc/localtime:ro'
    env:
      MYSQL_ROOT_PASSWORD: "{{user.pass}}"
      MYSQL_USER: "{{pgrole}}"
      MYSQL_PASSWORD: "{{pgrole}}"
      MYSQL_DATABASE: "{{pgrole}}"
      PUID: "{{ lookup('env','MYUID') }}"
      PGID: "{{ lookup('env','MYGID') }}"
    restart_policy: unless-stopped
    networks:
      - name: '{{pgrole}}-net'
    state: started

- name: Wait for 10 seconds before continuing
  wait_for:
    timeout: 10

- name: Add '{{pgrole}}-net' to network
  docker_network:
    name: '{{pgrole}}-net'
    connected:
      - '{{ pgrole }}'
    appends: yes



