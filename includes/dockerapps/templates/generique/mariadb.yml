---
- name: Create {{pgrole}}-net network
  docker_network:
    name: '{{pgrole}}-net'
    state: present

# Le registre (lscr.io -> ghcr.io) renvoie parfois une limite de débit
# transitoire (toomanyrequests) qui ferait échouer le déploiement. On réessaie
# le pull ; l'image n'est téléchargée que si elle est absente localement.
- name: 'Récupérer l''image MariaDB (résiste aux limites de débit du registre)'
  community.docker.docker_image:
    name: 'lscr.io/linuxserver/mariadb'
    source: pull
  register: mariadb_pull
  until: mariadb_pull is not failed
  retries: 12
  delay: 15

- name: 'Deploying db-{{pgrole}}'
  docker_container:
    keep_volumes: false
    labels:
      ssdv2.app: "{{pgrole}}"
    name: 'db-{{pgrole}}'
    recreate: true
    image: 'lscr.io/linuxserver/mariadb'
    pull: false
    volumes:
      # L'image linuxserver/mariadb stocke ses données dans /config
      # (MYSQL_DIR=/config, DATADIR=/config/databases) : le bind doit cibler
      # /config, sinon la base part dans un volume anonyme (perdue au rm -v).
      - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{pgrole}}/db-{{pgrole}}:/config"
    env:
      MYSQL_ROOT_PASSWORD: "{{user.pass}}"
      MYSQL_USER: "{{pgrole}}"
      MYSQL_PASSWORD: "{{pgrole}}"
      MYSQL_DATABASE: "{{pgrole}}"
      PUID: "{{ lookup('env','MYUID') }}"
      PGID: "{{ lookup('env','MYGID') }}"
    restart_policy: unless-stopped
    networks:
      - name: '{{pgrole}}-net'
    state: started
    container_default_behavior: "compatibility"
    init: false

- name: Wait for 10 seconds before continuing
  wait_for:
    timeout: 10

- name: Add '{{pgrole}}-net' to network
  docker_network:
    name: '{{pgrole}}-net'
    connected:
      - '{{ pgrole }}'
    appends: yes



