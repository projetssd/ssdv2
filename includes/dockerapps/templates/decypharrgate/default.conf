server {
    listen 8282;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;
    client_body_buffer_size 10m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;

    # Sonarr v5 convertit un 409 Conflict en "release rejetee" (skippee),
    # alors qu'un 404/502/503 est interprete comme un client indisponible
    # et cree une entree pending dans la file.
    #
    # Le corps de la reponse decypharr est inspecte pour ne convertir que
    # les vrais rejets de release. Une vraie panne 502 (sans code
    # provider_error) reste un 502 : Sonarr la traite comme une indisponibilite
    # temporaire du client.
    location = /api/v2/torrents/add {
        content_by_lua_block {
            ngx.req.read_body()
            local body = ngx.req.get_body_data()
            if not body then
                local body_file = ngx.req.get_body_file()
                if body_file then
                    local fh = io.open(body_file, "rb")
                    if fh then
                        body = fh:read("*a")
                        fh:close()
                    end
                end
            end
            body = body or ""

            local res = ngx.location.capture("/_decypharr_add", {
                method = ngx.HTTP_POST,
                body = body,
            })

            local status = res.status or 0
            local response_body = res.body or ""

            if status == 0 then
                status = 502
                response_body = '{"error":"decypharr upstream unavailable","code":"upstream_error","retryable":true,"permanent":false}'
            end

            local code = response_body:match('"code"%s*:%s*"([^"]+)"')
            local reject_codes = {
                torrent_not_cached = true,
                torrent_not_found = true,
                provider_error = true,
                traffic_exceeded = true,
                hoster_unavailable = true,
            }

            if code and reject_codes[code] and (status == 404 or status == 502 or status == 503) then
                local mapped = '{"error":"release rejected","code":"' .. code .. '","retryable":true,"permanent":false}'
                ngx.status = 409
                ngx.header["Content-Type"] = "application/json"
                ngx.header["Content-Length"] = #mapped
                ngx.print(mapped)
                return
            end

            ngx.status = status
            for k, v in pairs(res.header or {}) do
                local lk = string.lower(k)
                if lk ~= "content-length" and lk ~= "transfer-encoding" and lk ~= "connection" then
                    ngx.header[k] = v
                end
            end
            ngx.header["Content-Length"] = #response_body
            ngx.print(response_body)
        }
    }

    location = /_decypharr_add {
        internal;
        set $gate_backend "decypharrsonarr:8282";
        proxy_pass http://$gate_backend/api/v2/torrents/add;
        proxy_http_version 1.1;
        proxy_set_header Host decypharrsonarr:8282;
        proxy_set_header Accept-Encoding "";
        proxy_connect_timeout 10s;
        proxy_read_timeout 300s;
        proxy_pass_request_body on;
    }

    location / {
        set $backend "decypharrsonarr:8282";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
