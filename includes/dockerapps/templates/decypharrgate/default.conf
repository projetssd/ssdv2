server {
    listen 8282;
    resolver 127.0.0.11 valid=10s ipv6=off;
    client_max_body_size 50m;
    client_body_buffer_size 1m;
    proxy_connect_timeout 10s;
    proxy_read_timeout 300s;

    # Sonarr v5 convertit un 409 Conflict en "release rejetee" (skippee),
    # alors qu'un 404 est interprete comme un client de telechargement
    # indisponible et cree une entree pending dans la file.
    location = /api/v2/torrents/add {
        set $backend "decypharrsonarr:8282";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_intercept_errors on;
        error_page 404 = @not_cached;
    }

    location @not_cached {
        default_type application/json;
        return 409 '{"error":"torrent not cached","code":"torrent_not_cached","retryable":true,"permanent":false}';
    }

    location / {
        set $backend "decypharrsonarr:8282";
        proxy_pass http://$backend;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
