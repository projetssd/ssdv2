---
- name: Créer le dossier aiostreams
  file:
    path: "{{ settings.storage }}/docker/{{ lookup('env', 'USER') }}/aiostreams"
    state: directory
    owner: "{{ lookup('env','USER') }}"
    mode: '0755'

- name: Lire ou générer la clé secrète persistante
  no_log: true
  ansible.builtin.set_fact:
    my_secret_key: >-
      {{ lookup('password', settings.storage + '/docker/' + lookup('env','USER')
         + '/aiostreams/secret_key length=64 chars=hexdigits') }}

- name: Créer le fichier .env
  template:
    dest: "{{ settings.storage }}/docker/{{ lookup('env', 'USER') }}/aiostreams/{{ item.dest }}"
    src: "{{ settings.source }}/includes/dockerapps/templates/aiostreams/{{ item.src }}"
  with_items:
    - { dest: ".env", src: ".env.j2" }
  become: yes
  become_user: "{{ lookup('env', 'USER') }}"


