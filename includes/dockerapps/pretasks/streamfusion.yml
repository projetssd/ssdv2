---
- name: Set StreamFusion secrets directory
  ansible.builtin.set_fact:
    streamfusion_secret_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/streamfusion-secrets"
    streamfusion_stored: {}
    streamfusion_runtime: {}

- name: Create StreamFusion secrets directory
  ansible.builtin.file:
    path: "{{ streamfusion_secret_dir }}"
    state: directory
    mode: '0700'

- name: Lire les réglages StreamFusion mémorisés
  ansible.builtin.slurp:
    src: "{{ streamfusion_secret_dir }}/{{ item }}"
  loop: ['TMDB_API_KEY', 'ADMIN_SECRET_KEY', 'AD_BASE_URL', 'PROXY_URL']
  register: streamfusion_stored_files
  failed_when: false
  no_log: true

- name: Reprendre les fichiers présents, y compris un proxy vide
  ansible.builtin.set_fact:
    streamfusion_stored: "{{ streamfusion_stored | combine({item.item: item.content | b64decode | trim}) }}"
  loop: "{{ streamfusion_stored_files.results }}"
  when: item.content is defined
  no_log: true

- name: Lire les réglages de l'ancien conteneur StreamFusion
  ansible.builtin.command:
    argv:
      - docker
      - inspect
      - --format
      - '{% raw %}{{json .Config.Env}}{% endraw %}'
      - stream-fusion
  register: streamfusion_existing_env
  failed_when: false
  changed_when: false
  no_log: true

- name: Extraire uniquement les quatre réglages de l'ancien conteneur
  ansible.builtin.set_fact:
    streamfusion_runtime: "{{ streamfusion_runtime | combine({item.split('=', 1)[0]: item.split('=', 1)[1]}) }}"
  loop: "{{ (streamfusion_existing_env.stdout | from_json) if streamfusion_existing_env.rc == 0 else [] }}"
  when: item.split('=', 1)[0] in ['TMDB_API_KEY', 'ADMIN_SECRET_KEY', 'AD_BASE_URL', 'PROXY_URL']
  no_log: true

- name: Donner la priorité aux fichiers mémorisés
  ansible.builtin.set_fact:
    streamfusion_stored: "{{ streamfusion_runtime | combine(streamfusion_stored) }}"
  no_log: true

- name: Demander s'il faut modifier les réglages mémorisés
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id":"streamfusion.reconfigure","label":"Modifier les réglages mémorisés ?","kind":"confirm","secret":false,"default":"n"}
      Entrée/n = conserver ; o = reposer les quatre questions. Les secrets restent masqués.
  register: streamfusion_reconfigure_prompt
  when:
    - streamfusion_stored | length > 0
    - streamfusion_reconfigure is not defined

- name: Déterminer si les quatre questions doivent être reposées
  ansible.builtin.set_fact:
    streamfusion_configure: "{{ streamfusion_reconfigure | default((streamfusion_reconfigure_prompt.user_input | default('') | trim | lower) in ['o', 'oui', 'y', 'yes', 'true']) | bool }}"

- name: Demander TMDB_API_KEY
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "streamfusion.tmdb_key", "label": "Clé TMDB", "kind": "secret", "secret": true}
      Clé TMDB obligatoire. Entrée conserve une clé déjà mémorisée.
    echo: false
  register: streamfusion_tmdb_key_prompt
  when:
    - streamfusion_tmdb_api_key is not defined
    - streamfusion_configure | bool or 'TMDB_API_KEY' not in streamfusion_stored
  no_log: true

- name: Demander ADMIN_SECRET_KEY
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "streamfusion.admin_key", "label": "Clé ADMIN (minimum 32 caractères)", "kind": "secret", "secret": true}
      Clé ADMIN (minimum 32 caractères). Entrée = conserver la valeur existante.
    echo: false
  register: streamfusion_admin_key_prompt
  when:
    - streamfusion_admin_secret_key is not defined
    - streamfusion_configure | bool or 'ADMIN_SECRET_KEY' not in streamfusion_stored
  no_log: true

- name: Demander AD_BASE_URL
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "streamfusion.ad_base_url", "label": "URL API AllDebrid (recommandée : https://api.alldebrid.com)", "kind": "text", "secret": false}
      AD_BASE_URL : Entrée conserve la valeur existante, sinon utilise https://api.alldebrid.com.
    echo: true
  register: streamfusion_ad_base_url_prompt
  when:
    - streamfusion_ad_base_url is not defined
    - streamfusion_configure | bool or 'AD_BASE_URL' not in streamfusion_stored

- name: Demander PROXY_URL
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "streamfusion.proxy_url", "label": "URL du proxy (facultative)", "kind": "secret", "secret": true}
      PROXY_URL facultatif. Entrée conserve le proxy existant, sinon aucun proxy ; - = désactiver.
    echo: false
  register: streamfusion_proxy_url_prompt
  when:
    - streamfusion_proxy_url is not defined
    - streamfusion_configure | bool or 'PROXY_URL' not in streamfusion_stored
  no_log: true

- name: Résoudre les quatre réglages StreamFusion
  ansible.builtin.set_fact:
    TMDB_API_KEY: "{{ streamfusion_tmdb_api_key | default((streamfusion_tmdb_key_prompt.user_input | default('') | trim) or streamfusion_stored.get('TMDB_API_KEY', '')) | string | trim }}"
    ADMIN_SECRET_KEY: "{{ streamfusion_admin_secret_key | default((streamfusion_admin_key_prompt.user_input | default('') | trim) or streamfusion_stored.get('ADMIN_SECRET_KEY', '')) | string | trim }}"
    AD_BASE_URL: "{{ streamfusion_ad_base_url | default((streamfusion_ad_base_url_prompt.user_input | default('') | trim) or streamfusion_stored.get('AD_BASE_URL', 'https://api.alldebrid.com')) | string | trim }}"
    PROXY_URL: "{{ streamfusion_proxy_url | default((streamfusion_proxy_url_prompt.user_input | default('') | trim) or streamfusion_stored.get('PROXY_URL', '')) | string | trim }}"
  no_log: true

- name: Désactiver explicitement le proxy
  ansible.builtin.set_fact:
    PROXY_URL: "{{ '' if PROXY_URL == '-' else PROXY_URL }}"
  no_log: true

- name: Vérifier les réglages sans exposer leur contenu
  ansible.builtin.set_fact:
    streamfusion_settings_valid: >-
      {{ (TMDB_API_KEY | length > 0)
         and (ADMIN_SECRET_KEY | length >= 32)
         and (AD_BASE_URL is match('^https?://[^\s]+$'))
         and ('\n' not in PROXY_URL) and ('\r' not in PROXY_URL) }}
  no_log: true

- name: Validate provided StreamFusion secret facts
  ansible.builtin.assert:
    that: streamfusion_settings_valid | bool
    fail_msg: "Configuration incomplète ou invalide : TMDB requis, ADMIN minimum 32 caractères, AD_BASE_URL HTTP(S). Fournir les valeurs manquantes ou relancer en mode interactif."

- name: Mémoriser les quatre réglages StreamFusion
  ansible.builtin.copy:
    content: "{{ lookup('vars', item) }}\n"
    dest: "{{ streamfusion_secret_dir }}/{{ item }}"
    mode: '0600'
  loop: ['TMDB_API_KEY', 'ADMIN_SECRET_KEY', 'AD_BASE_URL', 'PROXY_URL']
  no_log: true

- name: Generate persistent StreamFusion internal secrets
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      umask 077

      secret_file="{{ streamfusion_secret_dir }}/{{ item }}"
      if [ ! -s "$secret_file" ]; then
        openssl rand -hex 32 > "$secret_file"
        chmod 0600 "$secret_file"
      fi
    executable: /bin/bash
  loop:
    - SECRET_API_KEY
    - CONFIG_SECRET_KEY
    - PEER_MASTER_KEY
    - POSTGRES_PASSWORD
    - PG_PASS
    - PG_MIGRATION_PASS
  changed_when: false
  no_log: true

- name: Read persistent StreamFusion internal secrets
  slurp:
    src: "{{ streamfusion_secret_dir }}/{{ item }}"
  loop:
    - SECRET_API_KEY
    - CONFIG_SECRET_KEY
    - PEER_MASTER_KEY
    - POSTGRES_PASSWORD
    - PG_PASS
    - PG_MIGRATION_PASS
  register: streamfusion_internal_secret_files
  no_log: true

- name: Set generated StreamFusion internal secret facts
  set_fact:
    SECRET_API_KEY: "{{ (streamfusion_internal_secret_files.results | selectattr('item', 'equalto', 'SECRET_API_KEY') | first).content | b64decode | trim }}"
    CONFIG_SECRET_KEY: "{{ (streamfusion_internal_secret_files.results | selectattr('item', 'equalto', 'CONFIG_SECRET_KEY') | first).content | b64decode | trim }}"
    PEER_MASTER_KEY: "{{ (streamfusion_internal_secret_files.results | selectattr('item', 'equalto', 'PEER_MASTER_KEY') | first).content | b64decode | trim }}"
    POSTGRES_PASSWORD: "{{ (streamfusion_internal_secret_files.results | selectattr('item', 'equalto', 'POSTGRES_PASSWORD') | first).content | b64decode | trim }}"
    PG_PASS: "{{ (streamfusion_internal_secret_files.results | selectattr('item', 'equalto', 'PG_PASS') | first).content | b64decode | trim }}"
    PG_MIGRATION_PASS: "{{ (streamfusion_internal_secret_files.results | selectattr('item', 'equalto', 'PG_MIGRATION_PASS') | first).content | b64decode | trim }}"
  no_log: true

- name: Validate generated StreamFusion internal secret facts
  assert:
    that:
      - SECRET_API_KEY | length == 64
      - CONFIG_SECRET_KEY | length == 64
      - PEER_MASTER_KEY | length == 64
      - POSTGRES_PASSWORD | length == 64
      - PG_PASS | length == 64
      - PG_MIGRATION_PASS | length == 64
      - SECRET_API_KEY != ADMIN_SECRET_KEY
      - SECRET_API_KEY != CONFIG_SECRET_KEY
      - ADMIN_SECRET_KEY != CONFIG_SECRET_KEY
      - POSTGRES_PASSWORD != PG_PASS
      - POSTGRES_PASSWORD != PG_MIGRATION_PASS
      - PG_PASS != PG_MIGRATION_PASS
    fail_msg: "Un secret StreamFusion est invalide ou deux secrets qui doivent être distincts sont identiques."
  no_log: true

- name: Stremio Base Pre-task Setup
  block:
    - name: Create StreamFusion Docker volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: present
      loop:
        - stremio-postgres
        - stremio-redis
        - stream-fusion
        - dmm-hashlists
        - sfr-db-backups
        - imdb-db
        - torrent-cache
        - taskiq-logs
        - pg-restore-secret

    - name: Initialize persistent PostgreSQL restore secret
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          docker run --rm \
            --network none \
            --cap-drop ALL \
            --security-opt no-new-privileges:true \
            --read-only \
            --entrypoint /bin/sh \
            -v pg-restore-secret:/run/pg-restore-secret \
            postgres:17-alpine \
            -ec '
              umask 077

              secret=/run/pg-restore-secret/pg_restore_pass
              tmp="${secret}.tmp"

              if [ ! -s "$secret" ]; then
                rm -f "$tmp"

                od -An -N32 -tx1 /dev/urandom \
                  | tr -d " \n" \
                  > "$tmp"

                test "$(wc -c < "$tmp")" -eq 64

                chmod 0444 "$tmp"
                mv "$tmp" "$secret"
              fi

              test "$(wc -c < "$secret")" -eq 64
              chmod 0444 "$secret"
            '
        executable: /bin/bash
      changed_when: false
      no_log: true

- name: Stremio Base Pre-task Setup
  block:
    - name: Deploy stremio-postgres
      community.docker.docker_container:
        name: stremio-postgres
        image: postgres:17-alpine
        state: started
        restart_policy: unless-stopped
        env:
          PGDATA: "/var/lib/postgresql/data/pgdata"
          POSTGRES_USER: "streamfusion"
          POSTGRES_PASSWORD: "{{ POSTGRES_PASSWORD }}"
          POSTGRES_DB: "streamfusion"
        exposed_ports:
          - "5432"
        volumes:
          - stremio-postgres:/var/lib/postgresql/data/pgdata
        healthcheck:
          test:
            - CMD-SHELL
            - >-
              PGPASSWORD="$POSTGRES_PASSWORD"
              psql
              -h 127.0.0.1
              -U "$POSTGRES_USER"
              -d "$POSTGRES_DB"
              -X
              -qAt
              -v ON_ERROR_STOP=1
              -c "SELECT 1"
              | grep -qx 1
          interval: 5s
          timeout: 5s
          retries: 20
          start_period: 5s
        networks:
          - name: traefik_proxy
      no_log: true

    - name: Wait for PostgreSQL to be healthy
      command: docker inspect --format="{% raw %}{{.State.Health.Status}}{% endraw %}" stremio-postgres
      register: postgres_health
      changed_when: false
      until: postgres_health.stdout == 'healthy'
      retries: 30
      delay: 5

    - name: Ensure hardened PostgreSQL roles and privileges
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          docker exec -i stremio-postgres \
            psql \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --username=streamfusion \
              --dbname=streamfusion <<'SQL'
          DO $$
          BEGIN
            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'streamfusion_owner') THEN
              CREATE ROLE streamfusion_owner;
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'streamfusion_runtime') THEN
              CREATE ROLE streamfusion_runtime LOGIN;
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'streamfusion_migration') THEN
              CREATE ROLE streamfusion_migration LOGIN;
            END IF;

            IF NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'streamfusion_restore') THEN
              CREATE ROLE streamfusion_restore LOGIN;
            END IF;
          END
          $$;

          ALTER ROLE streamfusion_owner
            WITH NOLOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE streamfusion_runtime
            WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE streamfusion_migration
            WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          ALTER ROLE streamfusion_restore
            WITH LOGIN NOSUPERUSER CREATEDB NOCREATEROLE NOINHERIT NOREPLICATION NOBYPASSRLS;

          GRANT streamfusion_owner
            TO streamfusion_migration
            WITH INHERIT FALSE, SET TRUE;

          GRANT streamfusion_owner
            TO streamfusion_restore
            WITH INHERIT FALSE, SET TRUE;

          GRANT pg_signal_backend
            TO streamfusion_restore
            WITH INHERIT TRUE, SET TRUE;

          -- Le rôle runtime ne doit jamais hériter du rôle propriétaire.
          DO $$
          BEGIN
            IF EXISTS (
              SELECT 1
              FROM pg_auth_members m
              JOIN pg_roles parent ON parent.oid = m.roleid
              JOIN pg_roles member ON member.oid = m.member
              WHERE parent.rolname = 'streamfusion_owner'
                AND member.rolname = 'streamfusion_runtime'
            ) THEN
              EXECUTE 'REVOKE streamfusion_owner FROM streamfusion_runtime';
            END IF;
          END
          $$;

          ALTER DATABASE streamfusion OWNER TO streamfusion_owner;
          ALTER SCHEMA public OWNER TO streamfusion_owner;

          -- Conversion ciblée d'une ancienne installation.
          -- REASSIGN OWNED est volontairement interdit ici : le rôle bootstrap
          -- possède aussi des objets internes PostgreSQL qui ne doivent jamais
          -- être transférés. On ne change que les relations applicatives du
          -- schéma public et on ignore les membres d'extensions.
          DO $$
          DECLARE
            obj record;
            ddl text;
          BEGIN
            FOR obj IN
              SELECT
                n.nspname,
                c.relname,
                c.relkind
              FROM pg_class c
              JOIN pg_namespace n ON n.oid = c.relnamespace
              WHERE n.nspname = 'public'
                AND pg_get_userbyid(c.relowner) = 'streamfusion'
                AND c.relkind IN ('r', 'p', 'S', 'v', 'm', 'f')
                AND NOT EXISTS (
                  SELECT 1
                  FROM pg_depend d
                  WHERE d.classid = 'pg_class'::regclass
                    AND d.objid = c.oid
                    AND d.deptype = 'e'
                )
              ORDER BY
                CASE c.relkind
                  WHEN 'S' THEN 2
                  ELSE 1
                END,
                c.relname
            LOOP
              ddl := CASE obj.relkind
                WHEN 'S' THEN format(
                  'ALTER SEQUENCE %I.%I OWNER TO streamfusion_owner',
                  obj.nspname, obj.relname
                )
                WHEN 'v' THEN format(
                  'ALTER VIEW %I.%I OWNER TO streamfusion_owner',
                  obj.nspname, obj.relname
                )
                WHEN 'm' THEN format(
                  'ALTER MATERIALIZED VIEW %I.%I OWNER TO streamfusion_owner',
                  obj.nspname, obj.relname
                )
                WHEN 'f' THEN format(
                  'ALTER FOREIGN TABLE %I.%I OWNER TO streamfusion_owner',
                  obj.nspname, obj.relname
                )
                ELSE format(
                  'ALTER TABLE %I.%I OWNER TO streamfusion_owner',
                  obj.nspname, obj.relname
                )
              END;

              EXECUTE ddl;
            END LOOP;
          END
          $$;

          REVOKE ALL ON DATABASE streamfusion FROM PUBLIC;
          GRANT CONNECT ON DATABASE streamfusion
            TO streamfusion_runtime, streamfusion_migration, streamfusion_restore;

          REVOKE CREATE ON SCHEMA public FROM PUBLIC;
          REVOKE CREATE ON SCHEMA public FROM streamfusion_runtime;
          GRANT USAGE ON SCHEMA public TO streamfusion_runtime;

          -- Nécessaire lors de la conversion d'une base existante : les objets déjà
          -- présents doivent devenir immédiatement utilisables par le rôle runtime.
          GRANT SELECT, INSERT, UPDATE, DELETE
            ON ALL TABLES IN SCHEMA public
            TO streamfusion_runtime;

          GRANT USAGE, SELECT, UPDATE
            ON ALL SEQUENCES IN SCHEMA public
            TO streamfusion_runtime;

          ALTER DEFAULT PRIVILEGES FOR ROLE streamfusion_owner IN SCHEMA public
            GRANT SELECT, INSERT, UPDATE, DELETE ON TABLES TO streamfusion_runtime;

          ALTER DEFAULT PRIVILEGES FOR ROLE streamfusion_owner IN SCHEMA public
            GRANT USAGE, SELECT, UPDATE ON SEQUENCES TO streamfusion_runtime;
          SQL
        executable: /bin/bash
      changed_when: false

    - name: Set hardened PostgreSQL role passwords
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail
          umask 077

          RESTORE_PASS="$(
            docker run --rm \
              --network none \
              --entrypoint /bin/sh \
              -v pg-restore-secret:/run/pg-restore-secret:ro \
              postgres:17-alpine \
              -c 'cat /run/pg-restore-secret/pg_restore_pass'
          )"

          printf '%s\n' "$RESTORE_PASS" | grep -Eq '^[0-9a-f]{64}$'

          if [ "$RESTORE_PASS" = "{{ POSTGRES_PASSWORD }}" ] || \
             [ "$RESTORE_PASS" = "{{ PG_PASS }}" ] || \
             [ "$RESTORE_PASS" = "{{ PG_MIGRATION_PASS }}" ]; then
            exit 1
          fi

          docker exec -i \
            -e SFR_POSTGRES_PASSWORD="{{ POSTGRES_PASSWORD }}" \
            -e SFR_RUNTIME_PASSWORD="{{ PG_PASS }}" \
            -e SFR_MIGRATION_PASSWORD="{{ PG_MIGRATION_PASS }}" \
            -e SFR_RESTORE_PASSWORD="$RESTORE_PASS" \
            stremio-postgres \
            /bin/sh -ec '
              psql \
                --no-psqlrc \
                --set=ON_ERROR_STOP=1 \
                --username=streamfusion \
                --dbname=streamfusion \
                --set=bootstrap_password="$SFR_POSTGRES_PASSWORD" \
                --set=runtime_password="$SFR_RUNTIME_PASSWORD" \
                --set=migration_password="$SFR_MIGRATION_PASSWORD" \
                --set=restore_password="$SFR_RESTORE_PASSWORD"
            ' <<'SQL'
          ALTER ROLE streamfusion
            WITH PASSWORD :'bootstrap_password';

          ALTER ROLE streamfusion_runtime
            WITH PASSWORD :'runtime_password';

          ALTER ROLE streamfusion_migration
            WITH PASSWORD :'migration_password';

          ALTER ROLE streamfusion_restore
            WITH PASSWORD :'restore_password';
          SQL
        executable: /bin/bash
      changed_when: false
      no_log: true

    - name: Validate hardened PostgreSQL roles
      ansible.builtin.shell:
        cmd: |
          set -euo pipefail

          docker exec -i stremio-postgres \
            psql \
              --no-psqlrc \
              --set=ON_ERROR_STOP=1 \
              --username=streamfusion \
              --dbname=streamfusion \
              --tuples-only \
              --no-align <<'SQL' \
            | grep -Fx 'OK'
          SELECT CASE
            WHEN
              EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'streamfusion_owner'
                  AND NOT rolcanlogin
                  AND NOT rolsuper
                  AND rolcreatedb
                  AND NOT rolcreaterole
                  AND NOT rolinherit
                  AND NOT rolreplication
                  AND NOT rolbypassrls
              )
              AND EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'streamfusion_runtime'
                  AND rolcanlogin
                  AND NOT rolsuper
                  AND NOT rolcreatedb
                  AND NOT rolcreaterole
                  AND NOT rolinherit
                  AND NOT rolreplication
                  AND NOT rolbypassrls
              )
              AND EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'streamfusion_migration'
                  AND rolcanlogin
                  AND NOT rolsuper
                  AND NOT rolcreatedb
                  AND NOT rolcreaterole
                  AND NOT rolinherit
                  AND NOT rolreplication
                  AND NOT rolbypassrls
              )
              AND EXISTS (
                SELECT 1
                FROM pg_roles
                WHERE rolname = 'streamfusion_restore'
                  AND rolcanlogin
                  AND NOT rolsuper
                  AND rolcreatedb
                  AND NOT rolcreaterole
                  AND NOT rolinherit
                  AND NOT rolreplication
                  AND NOT rolbypassrls
              )
              AND EXISTS (
                SELECT 1
                FROM pg_auth_members m
                JOIN pg_roles parent ON parent.oid = m.roleid
                JOIN pg_roles member ON member.oid = m.member
                WHERE parent.rolname = 'streamfusion_owner'
                  AND member.rolname = 'streamfusion_migration'
                  AND NOT m.inherit_option
                  AND m.set_option
              )
              AND EXISTS (
                SELECT 1
                FROM pg_auth_members m
                JOIN pg_roles parent ON parent.oid = m.roleid
                JOIN pg_roles member ON member.oid = m.member
                WHERE parent.rolname = 'streamfusion_owner'
                  AND member.rolname = 'streamfusion_restore'
                  AND NOT m.inherit_option
                  AND m.set_option
              )
              AND pg_has_role('streamfusion_restore', 'pg_signal_backend', 'MEMBER')
              AND pg_has_role('streamfusion_restore', 'pg_signal_backend', 'USAGE')
              AND (
                SELECT pg_get_userbyid(datdba)
                FROM pg_database
                WHERE datname = 'streamfusion'
              ) = 'streamfusion_owner'
              AND (
                SELECT pg_get_userbyid(nspowner)
                FROM pg_namespace
                WHERE nspname = 'public'
              ) = 'streamfusion_owner'
              AND NOT EXISTS (
                SELECT 1
                FROM pg_class c
                JOIN pg_namespace n ON n.oid = c.relnamespace
                WHERE n.nspname = 'public'
                  AND pg_get_userbyid(c.relowner) = 'streamfusion'
                  AND c.relkind IN ('r', 'p', 'S', 'v', 'm', 'f')
                  AND NOT EXISTS (
                    SELECT 1
                    FROM pg_depend d
                    WHERE d.classid = 'pg_class'::regclass
                      AND d.objid = c.oid
                      AND d.deptype = 'e'
                  )
              )
            THEN 'OK'
            ELSE 'ERROR'
          END;
          SQL
        executable: /bin/bash
      changed_when: false

    - name: Deploy stremio-redis
      community.docker.docker_container:
        name: stremio-redis
        image: redis:7-alpine
        state: started
        command:
          - redis-server
          - --appendonly
          - "yes"
        exposed_ports:
          - "6379"
        volumes:
          - stremio-redis:/data
        restart_policy: unless-stopped
        networks:
          - name: traefik_proxy

    - name: Deploy Taskiq worker
      community.docker.docker_container:
        name: taskiq-worker
        image: laster13/stream-fusion-reborn:latest
        state: started
        command: python -m taskiq worker stream_fusion.worker:broker
        env:
          SECRET_API_KEY: "{{ SECRET_API_KEY }}"
          CONFIG_SECRET_KEY: "{{ CONFIG_SECRET_KEY }}"
          PEER_MASTER_KEY: "{{ PEER_MASTER_KEY }}"
          TMDB_API_KEY: "{{ TMDB_API_KEY }}"

          PG_USER: "streamfusion_runtime"
          PG_PASS: "{{ PG_PASS }}"
          PG_BASE: "streamfusion"

          PG_RESTORE_USER: "streamfusion_restore"
          PG_RESTORE_PASS_FILE: "/run/pg-restore-secret/pg_restore_pass"
          PG_OWNER_ROLE: "streamfusion_owner"

          TZ: "Europe/Paris"
          # Partager les réglages de routage avec le conteneur principal.
          AD_BASE_URL: "{{ pg_env.AD_BASE_URL }}"
          PROXY_URL: "{{ pg_env.PROXY_URL | default(omit) }}"

          REDIS_HOST: "stremio-redis"
          PG_HOST: "stremio-postgres"
          TASKIQ_REDIS_DB: "6"
        cap_drop:
          - ALL
        security_opts:
          - "no-new-privileges:true"
        read_only: true
        tmpfs:
          - "/tmp:mode=1777,size=4g"
          - "/home/appuser:uid=1000,gid=1000,mode=0700"
        volumes:
          - dmm-hashlists:/data/dmm_hashlists
          - imdb-db:/data/imdb_db
          - sfr-db-backups:/data/backups
          - pg-restore-secret:/run/pg-restore-secret:ro
          - taskiq-logs:/app/config/logs
        restart_policy: unless-stopped
        networks:
          - name: traefik_proxy
      no_log: true

    - name: Deploy Taskiq scheduler
      community.docker.docker_container:
        name: taskiq-scheduler
        image: laster13/stream-fusion-reborn:latest
        state: started
        command: python -m taskiq scheduler stream_fusion.tkq:scheduler
        env:
          PG_USER: "streamfusion_runtime"
          PG_PASS: "{{ PG_PASS }}"
          PG_BASE: "streamfusion"

          TZ: "Europe/Paris"

          REDIS_HOST: "stremio-redis"
          PG_HOST: "stremio-postgres"
          TASKIQ_REDIS_DB: "6"
        cap_drop:
          - ALL
        security_opts:
          - "no-new-privileges:true"
        read_only: true
        tmpfs:
          - "/tmp:mode=1777"
          - "/home/appuser:uid=1000,gid=1000,mode=0700"
        volumes:
          - taskiq-logs:/app/config/logs
        restart_policy: unless-stopped
        networks:
          - name: traefik_proxy
      no_log: true

  rescue:
    - name: Display error message
      fail:
        msg: "An error occurred during the Stremio pre-task setup. Please check the logs for more details."
