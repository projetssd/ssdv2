---
- name: Ask for TMDB_API_KEY only if not provided
  pause:
    prompt: "Entre ta clé TMDB_API_KEY"
    echo: false
  register: tmdb_api_key_prompt
  when: streamfusion_tmdb_api_key is not defined or (streamfusion_tmdb_api_key | string | trim) == ""
  no_log: true

- name: Ask for SECRET_API_KEY only if not provided
  pause:
    prompt: "Entre ta SECRET_API_KEY"
    echo: false
  register: secret_api_key_prompt
  when: streamfusion_secret_api_key is not defined or (streamfusion_secret_api_key | string | trim) == ""
  no_log: true

- name: Set provided StreamFusion secret facts
  set_fact:
    TMDB_API_KEY: "{{ (streamfusion_tmdb_api_key | default(tmdb_api_key_prompt.user_input | default(''), true) | string | trim) }}"
    SECRET_API_KEY: "{{ (streamfusion_secret_api_key | default(secret_api_key_prompt.user_input | default(''), true) | string | trim) }}"
  no_log: true

- name: Validate StreamFusion provided secret facts
  assert:
    that:
      - TMDB_API_KEY | length > 0
      - SECRET_API_KEY | length > 0
    fail_msg: "TMDB_API_KEY ou SECRET_API_KEY est vide ou non transmis."
  no_log: true

- name: Set StreamFusion secrets directory
  set_fact:
    streamfusion_secret_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/streamfusion-secrets"

- name: Create StreamFusion secrets directory
  file:
    path: "{{ streamfusion_secret_dir }}"
    state: directory
    mode: "0700"

- name: Generate persistent MEILI_MASTER_KEY
  shell: |
    if [ ! -f "{{ streamfusion_secret_dir }}/MEILI_MASTER_KEY" ]; then
      openssl rand -hex 32 > "{{ streamfusion_secret_dir }}/MEILI_MASTER_KEY"
      chmod 0600 "{{ streamfusion_secret_dir }}/MEILI_MASTER_KEY"
    fi
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Generate persistent CONFIG_SECRET_KEY
  shell: |
    if [ ! -f "{{ streamfusion_secret_dir }}/CONFIG_SECRET_KEY" ]; then
      openssl rand -hex 32 > "{{ streamfusion_secret_dir }}/CONFIG_SECRET_KEY"
      chmod 0600 "{{ streamfusion_secret_dir }}/CONFIG_SECRET_KEY"
    fi
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Generate persistent PEER_MASTER_KEY
  shell: |
    if [ ! -f "{{ streamfusion_secret_dir }}/PEER_MASTER_KEY" ]; then
      openssl rand -hex 32 > "{{ streamfusion_secret_dir }}/PEER_MASTER_KEY"
      chmod 0600 "{{ streamfusion_secret_dir }}/PEER_MASTER_KEY"
    fi
  args:
    executable: /bin/bash
  changed_when: false
  no_log: true

- name: Read persistent MEILI_MASTER_KEY
  slurp:
    src: "{{ streamfusion_secret_dir }}/MEILI_MASTER_KEY"
  register: meili_master_key_file
  no_log: true

- name: Read persistent CONFIG_SECRET_KEY
  slurp:
    src: "{{ streamfusion_secret_dir }}/CONFIG_SECRET_KEY"
  register: config_secret_key_file
  no_log: true

- name: Read persistent PEER_MASTER_KEY
  slurp:
    src: "{{ streamfusion_secret_dir }}/PEER_MASTER_KEY"
  register: peer_master_key_file
  no_log: true

- name: Set generated StreamFusion secret facts
  set_fact:
    MEILI_MASTER_KEY: "{{ meili_master_key_file.content | b64decode | trim }}"
    CONFIG_SECRET_KEY: "{{ config_secret_key_file.content | b64decode | trim }}"
    PEER_MASTER_KEY: "{{ peer_master_key_file.content | b64decode | trim }}"
  no_log: true

- name: Stremio Base Pre-task Setup
  block:
    - name: Create StreamFusion Docker volumes
      community.docker.docker_volume:
        name: "{{ item }}"
        state: present
      loop:
        - stremio-postgres
        - stremio-redis
        - stream-fusion
        - warp-data
        - meili-data
        - dmm-hashlists
        - imdb-db
        - torrent-cache
        - taskiq-logs
        - db-backups
        - meili-restore-control
        - meili-wrapper

    # Le dépôt/builder GitHub reste privé : les installations tirent l'image publique Docker Hub.
    - name: Pull latest public Stream Fusion Reborn image
      command: docker pull laster13/stream-fusion-reborn:latest
      register: streamfusion_image_pull
      changed_when: "'Downloaded newer image' in streamfusion_image_pull.stdout"

    # Équivalent du service meili-init du docker-compose : prépare le wrapper
    # d'auto-restauration et le volume de contrôle avant Meilisearch.
    - name: Prepare Meilisearch auto-restore wrapper
      shell: |
        set -euo pipefail

        docker run --rm \
          --network none \
          --user 0:0 \
          --entrypoint /bin/sh \
          -v meili-wrapper:/meili_wrapper \
          -v meili-restore-control:/meili_restore_control \
          laster13/stream-fusion-reborn:latest \
          -c '
            set -eu

            echo "[meili-init] Préparation"

            mkdir -p /meili_wrapper
            mkdir -p /meili_restore_control

            cp \
              /opt/streamfusion/meili-auto-restore.sh \
              /meili_wrapper/.meili-auto-restore.sh.tmp

            chmod 0555 \
              /meili_wrapper/.meili-auto-restore.sh.tmp

            mv -f \
              /meili_wrapper/.meili-auto-restore.sh.tmp \
              /meili_wrapper/meili-auto-restore.sh

            chown -R 1000:1000 \
              /meili_restore_control

            chmod 0770 \
              /meili_restore_control

            find /meili_restore_control \
              -type f \
              -exec chmod 0660 {} \;

            echo "[meili-init] Terminé"
          '
      args:
        executable: /bin/bash

- name: Set DNS Record on CloudFlare
  include_tasks: "{{ settings.source }}/includes/config/roles/cloudflare/tasks/main.yml"
  vars:
    subdomain: "{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}"
  when: cloudflare_enabled

- name: Stremio Base Pre-task Setup
  block:
    - name: Check if persistent infrastructure containers exist
      command: docker ps -a --filter "name={{ item }}" --format "{% raw %}{{.Names}}{% endraw %}"
      register: container_check
      changed_when: false
      loop:
        - stremio-postgres
        - stremio-redis
        - warp

    - name: Debug container check results
      debug:
        var: container_check

    - name: Set facts for container existence
      set_fact:
        postgres_exists: "{{ 'stremio-postgres' in container_check.results | map(attribute='stdout') | join(',') }}"
        redis_exists: "{{ 'stremio-redis' in container_check.results | map(attribute='stdout') | join(',') }}"
        warp_exists: "{{ 'warp' in container_check.results | map(attribute='stdout') | join(',') }}"

    - name: Debug container existence
      debug:
        msg:
          - "Postgres exists: {{ postgres_exists }}"
          - "Redis exists: {{ redis_exists }}"
          - "Warp exists: {{ warp_exists }}"

    - name: Deploy stremio-postgres
      community.docker.docker_container:
        name: stremio-postgres
        image: "postgres:17-alpine"
        state: started
        env:
          PGDATA: "/var/lib/postgresql/data/pgdata"
          POSTGRES_USER: "streamfusion"
          POSTGRES_PASSWORD: "streamfusion"
          POSTGRES_DB: "streamfusion"
        volumes:
          - stremio-postgres:/var/lib/postgresql/data/pgdata
        restart_policy: always
        healthcheck:
          test: ["CMD-SHELL", "pg_isready -U streamfusion -d streamfusion"]
          interval: 5s
          timeout: 5s
          retries: 10
        networks:
          - name: traefik_proxy
      when: not postgres_exists

    - name: Wait for PostgreSQL to be healthy
      command: docker inspect --format="{% raw %}{{.State.Health.Status}}{% endraw %}" stremio-postgres
      register: postgres_health
      changed_when: false
      until: postgres_health.stdout == 'healthy'
      retries: 12
      delay: 10

    - name: Deploy stremio-redis
      community.docker.docker_container:
        name: stremio-redis
        image: redis:7-alpine
        state: started
        command: redis-server --appendonly yes
        exposed_ports:
          - "6379"
        volumes:
          - stremio-redis:/data
        restart_policy: unless-stopped
        healthcheck:
          test: ["CMD", "redis-cli", "ping"]
          interval: 5s
          timeout: 5s
          retries: 10
        networks:
          - name: traefik_proxy
      when: not redis_exists

    - name: Wait for Redis to be healthy
      command: docker inspect --format="{% raw %}{{.State.Health.Status}}{% endraw %}" stremio-redis
      register: redis_health
      changed_when: false
      until: redis_health.stdout == 'healthy'
      retries: 12
      delay: 10

    # Toujours géré afin d'appliquer les nouveaux volumes/commande auto-restore
    # même si un ancien conteneur Meilisearch existe déjà.
    - name: Deploy Meilisearch
      community.docker.docker_container:
        name: meilisearch
        image: getmeili/meilisearch:v1.41.0
        state: started
        env:
          MEILI_MASTER_KEY: "{{ MEILI_MASTER_KEY }}"
          MEILI_ENV: "production"
          MEILI_EXPERIMENTAL_DUMPLESS_UPGRADE: "true"
          MEILI_DB_PATH: "/meili_data/data.ms"
        exposed_ports:
          - "7700"
        volumes:
          - meili-data:/meili_data
          - db-backups:/imports:ro
          - meili-wrapper:/meili_wrapper:ro
          - meili-restore-control:/meili_restore_control
        command: /meili_wrapper/meili-auto-restore.sh
        restart_policy: unless-stopped
        healthcheck:
          test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:7700/health || exit 1"]
          interval: 5s
          timeout: 5s
          retries: 10
        networks:
          - name: traefik_proxy

    - name: Wait for Meilisearch to be healthy
      command: docker inspect --format="{% raw %}{{.State.Health.Status}}{% endraw %}" meilisearch
      register: meilisearch_health
      changed_when: false
      until: meilisearch_health.stdout == 'healthy'
      retries: 12
      delay: 10

    - name: Deploy Warp
      community.docker.docker_container:
        name: warp
        image: caomingjun/warp:latest
        state: started
        restart_policy: always
        exposed_ports:
          - "1080"
        env:
          WARP_SLEEP: "2"
        capabilities:
          - NET_ADMIN
        sysctls:
          net.ipv6.conf.all.disable_ipv6: "0"
          net.ipv4.conf.all.src_valid_mark: "1"
        volumes:
          - warp-data:/var/lib/cloudflare-warp
        networks:
          - name: traefik_proxy
      when: not warp_exists

    - name: Wait for stremio-redis to be healthy before Taskiq
      command: docker inspect --format="{% raw %}{{.State.Health.Status}}{% endraw %}" stremio-redis
      register: redis_health_taskiq
      changed_when: false
      retries: 12
      delay: 5
      until: redis_health_taskiq.stdout == 'healthy'

    - name: Wait for Meilisearch to be running before Taskiq
      command: docker inspect --format="{% raw %}{{.State.Running}}{% endraw %}" meilisearch
      register: meilisearch_running
      changed_when: false
      retries: 12
      delay: 5
      until: meilisearch_running.stdout == 'true'

    # Toujours géré : indispensable pour appliquer PG_BASE à une installation existante.
    - name: Deploy Taskiq scheduler
      community.docker.docker_container:
        name: taskiq-scheduler
        image: laster13/stream-fusion-reborn:latest
        state: started
        pull: true
        command: python -m taskiq scheduler stream_fusion.tkq:scheduler
        env:
          PG_USER: "streamfusion"
          PG_PASS: "streamfusion"
          PG_BASE: "streamfusion"
          TZ: "Europe/Paris"
          REDIS_HOST: stremio-redis
          PG_HOST: stremio-postgres
          TASKIQ_REDIS_DB: "6"
        cap_drop:
          - ALL
        security_opts:
          - "no-new-privileges:true"
        read_only: true
        tmpfs:
          - "/tmp:mode=1777"
          - "/home/appuser:uid=1000,gid=1000,mode=0700"
        volumes:
          - taskiq-logs:/app/config/logs
        restart_policy: unless-stopped
        networks:
          - name: traefik_proxy

    - name: Deploy Taskiq workers
      community.docker.docker_container:
        name: taskiq-worker
        image: laster13/stream-fusion-reborn:latest
        state: started
        pull: true
        command: python -m taskiq worker stream_fusion.worker:broker
        env:
          SECRET_API_KEY: "{{ SECRET_API_KEY }}"
          TMDB_API_KEY: "{{ TMDB_API_KEY }}"
          PG_USER: "streamfusion"
          PG_PASS: "streamfusion"
          PG_BASE: "streamfusion"
          MEILI_MASTER_KEY: "{{ MEILI_MASTER_KEY }}"
          TZ: "Europe/Paris"
          PROXY_URL: http://warp:1080
          REDIS_HOST: stremio-redis
          PG_HOST: stremio-postgres
          MEILI_HOST: meilisearch
          MEILI_PORT: "7700"
          TASKIQ_REDIS_DB: "6"
          PEER_MASTER_KEY: "{{ PEER_MASTER_KEY }}"
        cap_drop:
          - ALL
        security_opts:
          - "no-new-privileges:true"
        read_only: true
        tmpfs:
          - "/tmp:mode=1777,size=8g"
          - "/home/appuser:uid=1000,gid=1000,mode=0700"
        volumes:
          - dmm-hashlists:/data/dmm_hashlists
          - imdb-db:/data/imdb_db
          - db-backups:/data/backups
          - meili-data:/meili_data:ro
          - meili-restore-control:/meili_restore_control
          - taskiq-logs:/app/config/logs
        restart_policy: unless-stopped
        networks:
          - name: traefik_proxy

  rescue:
    - name: Display error message
      fail:
        msg: "An error occurred during the Stremio pre-task setup. Please check the logs for more details."
