---
- pause:
    prompt: |
      SSDV2_PROMPT {"id": "rtorrentvpn.vpn", "label": "Serveur VPN", "kind": "choice", "secret": false, "options": ["openvpn", "wireguard"]}
      Serveur VPN utilisé ( openvpn ou wireguard uniquement )
    echo: yes
  register: vpn
- set_fact:
    vpn: "{{ vpn.user_input }}"
- pause:
    prompt: |
      SSDV2_PROMPT {"id": "rtorrentvpn.port", "label": "Port forwarded", "kind": "text", "secret": false}
      Port forwarded ouvert sur votr serveur vpn pour rtorrent (ex: 45000)
    echo: yes
  register: portforwarded
- set_fact:
    portforwarded: "{{ portforwarded.user_input }}"
- name: Checking for existing app data
  stat:
    path: '{{ settings.storage }}/docker/{{user.name}}/rtorrentvpn/rtorrent/config/rtorrent.rc'
  register: rccheck
- set_fact:
    vpn_specific:
      openvpn:
        capabilities: "NET_ADMIN"
      wireguard:
        sysctls: "net.ipv4.conf.all.src_valid_mark=1"
        privileged: true
