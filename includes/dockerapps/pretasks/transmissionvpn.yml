---
- name: prompt for provider
  pause:
    prompt: |
      SSDV2_PROMPT {"id": "transmissionvpn.provider", "label": "Fournisseur VPN", "kind": "text", "secret": false}
      Enter value for OPENVPN_PROVIDER
    echo: "yes"
  register: myregister
- name: set var
  set_fact:
    provider: "{{ myregister.user_input }}"
- name: prompt for username
  pause:
    prompt: |
      SSDV2_PROMPT {"id": "transmissionvpn.username", "label": "Identifiant VPN", "kind": "text", "secret": false}
      Enter value for OPENVPN_USERNAME
    echo: "yes"
  register: myregister
- name: set var
  set_fact:
    username: "{{ myregister.user_input }}"
- name: prompt for password
  pause:
    prompt: |
      SSDV2_PROMPT {"id": "transmissionvpn.password", "label": "Mot de passe VPN", "kind": "secret", "secret": true}
      Enter value for OPENVPN_PASSWORD
    echo: "yes"
  register: myregister
- name: set var
  set_fact:
    password: "{{ myregister.user_input }}"
- name: prompt for network
  pause:
    prompt: |
      SSDV2_PROMPT {"id": "transmissionvpn.local_network", "label": "Réseau local", "kind": "text", "secret": false}
      Enter value for LOCAL_NETWORK (ex 192.168.1.0/24)
    echo: "yes"
  register: myregister
- name: set var
  set_fact:
    mynetwork: "{{ myregister.user_input }}"
- name: prompt for config
  pause:
    prompt: |
      SSDV2_PROMPT {"id": "transmissionvpn.config", "label": "Config OpenVPN", "kind": "text", "secret": false}
      Enter value for OPENVPN_CONFIG (Nom fichier sans la terminaison opvn)
    echo: "yes"
  register: myregister
- name: set var
  set_fact:
    config: "{{ myregister.user_input }}"



