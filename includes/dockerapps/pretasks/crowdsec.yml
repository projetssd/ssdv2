---
- name: Creating paths
  file: 'path={{item}} state=directory mode=0775 owner={{user.userid}} group={{user.groupid}}'
  with_items:
    - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}"

# L'ancien conteneur peut avoir des ports malformés (7422/tcp/tcp) ou un
# binding 0.0.0.0:8080 hérité d'une ancienne version. Le module
# community.docker ne sait pas le réconcilier et échoue avant la posttask,
# empêchant le déploiement de la whitelist. Les données sont dans des bind
# mounts : on repart d'un conteneur propre à chaque installation.
- name: Supprimer l'ancien conteneur CrowdSec
  ansible.builtin.command: docker rm -f crowdsec
  failed_when: false
  changed_when: false

# Le LAPI est publié sur la loopback via un port libre choisi par Docker :
# aucun conflit possible avec un autre service (8181 ou autre). La posttask
# lit ensuite le port réellement attribué pour configurer le firewall bouncer.
- name: crowdsec
  docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    image: crowdsecurity/crowdsec:latest
    name: crowdsec
    ports:
      - "127.0.0.1:8181:8080"
    exposed_ports:
      - "7422" # AppSec (WAF), non publie sur l'hote
    volumes:
      - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/crowdsec/data:/var/lib/crowdsec/data"
      - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/crowdsec/etc:/etc/crowdsec"
      - "/var/log/auth.log:/var/log/auth.log:ro"
      - "/var/log/syslog:/var/log/syslog:ro"
      - "{{ settings.storage }}/docker/traefik/logs:/var/log/traefik:ro"
    env:
      GID: "1000"
      COLLECTIONS: "crowdsecurity/traefik crowdsecurity/http-cve crowdsecurity/base-http-scenarios crowdsecurity/sshd crowdsecurity/linux crowdsecurity/appsec-generic-rules crowdsecurity/appsec-virtual-patching crowdsecurity/appsec-crs"
      CUSTOM_HOSTNAME: "Srv-Docker-Demo"
      TZ: "Europe/Paris"
    state: started
    restart_policy: unless-stopped
    networks:
      - name: traefik_proxy
