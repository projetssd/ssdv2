---
- name: Set DNS Record on CloudFlare
  include_tasks: "{{ settings.source }}/includes/config/roles/cloudflare/tasks/main.yml"
  vars:
    subdomain: "{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}"
  when: cloudflare_enabled

- pause:
    prompt: |
      SSDV2_PROMPT {"id": "seerrcatalog.arrs_key", "label": "Clé de configuration arrs", "kind": "secret", "secret": true}
      Entrez une clé de votre choix pour la config des arrs
    echo: yes
  register: arrs_input

- pause:
    prompt: |
      SSDV2_PROMPT {"id": "seerrcatalog.tmdb_key", "label": "Clé TMDB", "kind": "secret", "secret": true}
      Entrez votre clé TMDB
    echo: yes
  register: tmdb_input
