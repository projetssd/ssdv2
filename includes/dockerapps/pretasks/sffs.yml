---
# Pretask sffs : vérifications, sources, images (sffs et Silo modifié), configuration StreamFusion,
# et définition de silo avec l'image modifiée (<storage>/vars/silo.yml). La posttask installe ou
# redéploie silo avec cette définition, une fois sffs démarré.
# Relancer l'application met à jour les sources et les images qui ont changé.

# --- Prérequis : rien n'est créé si l'un d'eux manque -------------------------------------

- name: StreamFusion est-il installé par SSDV2 ?
  ansible.builtin.command: sqlite3 "{{ settings.source }}/ssddb" "select status from applications where name='streamfusion'"
  register: sffs_reg_sf
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuser l'installation sans StreamFusion
  ansible.builtin.fail:
    msg: "StreamFusion n'est pas installé par SSDV2 (ou sqlite3 manque) : l'installer d'abord."
  when: sffs_reg_sf.rc != 0 or sffs_reg_sf.stdout | trim != '2'

- name: Conteneur StreamFusion (stream-fusion ou streamfusion selon la version de SSDV2)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      for c in $(docker ps --filter label=ssdv2.app=streamfusion --format '{% raw %}{{.Names}}{% endraw %}') stream-fusion streamfusion; do
        case "$c" in stremio-*|taskiq-*|sftorznab*) continue ;; esac
        if [ "$(docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' "$c" 2>/dev/null)" = true ] &&
           docker inspect -f '{% raw %}{{.Config.Image}}{% endraw %}' "$c" | grep -q stream-fusion; then
          echo "$c"; exit 0
        fi
      done
      exit 1
    executable: /bin/bash
  register: sffs_sf
  changed_when: false
  check_mode: false
  failed_when: false

- name: Refuser l'installation si StreamFusion est arrêté
  ansible.builtin.command: docker inspect -f '{% raw %}{{.State.Running}}{% endraw %}' stremio-postgres
  register: sffs_sf_pg
  changed_when: false
  check_mode: false
  failed_when: sffs_sf.rc != 0 or sffs_sf_pg.rc != 0 or sffs_sf_pg.stdout | trim != 'true'

- name: Vérifier /dev/fuse
  ansible.builtin.stat:
    path: /dev/fuse
  register: sffs_fuse
  failed_when: not sffs_fuse.stat.exists

# Le montage FUSE de sffs doit remonter du conteneur vers l'hôte, puis vers Silo.
- name: Propagation de /mnt
  ansible.builtin.command: findmnt -no PROPAGATION --target /mnt
  register: sffs_prop
  changed_when: false
  check_mode: false
  failed_when: not (sffs_prop.stdout | trim).startswith('shared')

- name: Définition de l'application silo du catalogue
  ansible.builtin.stat:
    path: "{{ settings.source }}/includes/dockerapps/vars/silo.yml"
  register: sffs_silo_catalogue
  failed_when: not sffs_silo_catalogue.stat.exists

# --- Silo : déjà installé, ou à installer --------------------------------------------------

- name: Silo est-il installé par SSDV2 ?
  ansible.builtin.command: sqlite3 "{{ settings.source }}/ssddb" "select status from applications where name='silo'"
  register: sffs_reg_silo
  changed_when: false
  check_mode: false
  failed_when: false

- name: Chemins de sffs
  ansible.builtin.set_fact:
    sffs_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}"
    sffs_secret_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}-secrets"
    sffs_silo_vars: "{{ settings.storage }}/vars/silo.yml"
    sffs_sf_container: "{{ sffs_sf.stdout | trim }}"
    sffs_silo_installed: "{{ sffs_reg_silo.stdout | default('') | trim == '2' }}"
    sffs_silo_sub_known: "{{ (((sub | default({}, true))['silo'] | default({}, true))['silo'] | default('', true)) | string | trim }}"

# Silo absent : il sera installé par la posttask, qui ne peut pas poser de questions.
- name: Demander le sous-domaine de Silo
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "sffs.silo_subdomain", "label": "Sous-domaine de Silo", "kind": "text", "secret": false}
      Silo n'est pas installé : il le sera avec sffs. Sous-domaine de Silo (défaut : silo ; l'API Jellyfin sera sur <sous-domaine>-jf)
  register: sffs_silo_sub_prompt
  when:
    - not sffs_silo_installed
    - sffs_silo_sub_known == ''
    - (sffs_silo_subdomain | default('')) == ''

- name: Enregistrer le sous-domaine et l'authentification de Silo
  ansible.builtin.command:
    argv:
      - bash
      - "{{ settings.source }}/includes/config/scripts/generique.sh"
      - manage_account_yml
      - "{{ item.key }}"
      - "{{ item.value }}"
  loop:
    - key: sub.silo.silo
      value: "{{ sffs_silo_subdomain | default(sffs_silo_sub_prompt.user_input | default('', true) | trim, true) or 'silo' }}"
    # Silo gère ses comptes, et les applications Jellyfin ne savent pas passer une authentification Traefik.
    - key: sub.silo.auth
      value: "{{ sffs_silo_auth | default('aucune') }}"
  changed_when: true
  when:
    - not sffs_silo_installed
    - sffs_silo_sub_known == ''

# --- Dossiers, sources, images --------------------------------------------------------------

- name: Créer les dossiers de sffs
  ansible.builtin.file:
    path: "{{ item.path }}"
    state: directory
    mode: "{{ item.mode }}"
  loop:
    - { path: "{{ sffs_dir }}/config", mode: "0755" }
    - { path: "{{ sffs_secret_dir }}", mode: "0700" }

- name: Créer /mnt/sffs (point de montage de sffs)
  become: true
  ansible.builtin.file:
    path: /mnt/sffs
    state: directory
    mode: "0755"

- name: Sources de sffs (et des patchs Silo)
  ansible.builtin.git:
    repo: "{{ sffs_repo }}"
    dest: "{{ sffs_dir }}/src"
    version: "{{ sffs_repo_version }}"
    force: true

# Chaque image porte l'empreinte git de ses sources (étiquette sffs.tree). Une image à jour est
# gardée ; sinon elle est téléchargée (si le registre en a une aux bonnes sources) ou construite.
- name: Images sffs et Silo modifié (téléchargées ou construites)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      src="{{ sffs_dir }}/src"
      label() { docker image inspect -f '{% raw %}{{index .Config.Labels "sffs.tree"}}{% endraw %}' "$1" 2>/dev/null || true; }
      for spec in sffs:sffs silo-sffs:silo; do
        name=${spec%%:*} dir=${spec##*:}
        want=$(git -C "$src" rev-parse "HEAD:$dir")
        [ "$(label "localhost/$name:latest")" = "$want" ] && { echo "$name : à jour"; continue; }
        if [ -n "$REGISTRY" ] && [ "$BUILD_LOCAL" != True ] && docker pull -q "$REGISTRY/$name:latest" >/dev/null 2>&1 &&
           [ "$(label "$REGISTRY/$name:latest")" = "$want" ]; then
          docker tag "$REGISTRY/$name:latest" "localhost/$name:latest"; echo "$name : téléchargée"; continue
        fi
        echo "$name : construction"
        CONTAINER_ENGINE=docker SFFS_IMAGE=localhost/sffs:latest SILO_IMAGE=localhost/silo-sffs:latest \
          SILO_SRC="{{ sffs_dir }}/silo-src" "$src/build-images.sh" "$( [ "$dir" = silo ] && echo silo || echo sffs )" >/dev/null
      done
    executable: /bin/bash
  environment:
    REGISTRY: "{{ sffs_registry | default('') }}"
    BUILD_LOCAL: "{{ sffs_build_local | default(false) | bool }}"
  register: sffs_images
  changed_when: sffs_images.stdout is search('téléchargée|construction')

- name: Images
  ansible.builtin.debug:
    var: sffs_images.stdout_lines

# L'image modifiée est figée sur un commit de Silo (silo/BASE_COMMIT du dépôt sffs) : refuser une
# base déjà migrée par une version plus récente plutôt que de risquer de l'abîmer.
- name: Dernière migration connue de l'image modifiée
  ansible.builtin.command: docker image inspect -f '{% raw %}{{index .Config.Labels "sffs.silo.migration"}}{% endraw %}' localhost/silo-sffs:latest
  register: sffs_image_mig
  changed_when: false

- name: Dernière migration appliquée à la base de Silo
  ansible.builtin.command: >-
    docker exec db-silo psql -U silo -d silo -qAtc
    "select coalesce(max(version_id), 0) from goose_db_version where is_applied"
  register: sffs_db_mig
  changed_when: false
  failed_when: false

- name: Refuser une base plus récente que l'image modifiée
  ansible.builtin.fail:
    msg: >-
      Silo est plus récent (migration {{ sffs_db_mig.stdout | trim }}) que l'image modifiée
      (migration {{ sffs_image_mig.stdout | trim }}) : rien n'a été changé. Attendre une mise à jour
      des patchs sffs, puis relancer.
  when:
    - sffs_db_mig.rc == 0
    - sffs_image_mig.stdout | trim is match('^[0-9]+$')
    - sffs_db_mig.stdout | trim | int > sffs_image_mig.stdout | trim | int

# --- Configuration de sffs (StreamFusion, AllDebrid, TMDB) ----------------------------------

- name: Lire les secrets existants
  ansible.builtin.slurp:
    src: "{{ sffs_secret_dir }}/{{ item }}"
  loop: [SF_STREAM_CFG, SF_PLAYBACK_CFG, SFFS_TMDB_KEY, SFFS_DB_PASS]
  register: sffs_existing
  failed_when: false
  no_log: true

- name: Mémoriser les secrets existants
  ansible.builtin.set_fact:
    sffs_known: "{{ sffs_known | default({}) | combine({item.item: (item.content | b64decode | trim)}) }}"
  loop: "{{ sffs_existing.results }}"
  when: item.content is defined and (item.content | b64decode | trim | length > 0)
  no_log: true

- name: Aucun secret connu
  ansible.builtin.set_fact:
    sffs_known: {}
  when: sffs_known is not defined

- name: Variables de StreamFusion (PROXY_URL, TMDB_API_KEY)
  ansible.builtin.command: docker inspect -f '{% raw %}{{range .Config.Env}}{{println .}}{{end}}{% endraw %}' {{ sffs_sf_container }}
  register: sffs_sf_env
  changed_when: false
  no_log: true

- name: Proxy des téléchargements de sffs
  ansible.builtin.set_fact:
    sffs_debrid_proxy: >-
      {{ (sffs_debrid_proxy_override | default(sffs_sf_env.stdout_lines | select('match', '^PROXY_URL=')
         | map('regex_replace', '^PROXY_URL=', '') | first | default(''))) | trim }}

- name: Adresse locale de StreamFusion (réseau traefik_proxy)
  ansible.builtin.command: docker inspect -f '{% raw %}{{(index .NetworkSettings.Networks "traefik_proxy").IPAddress}}{% endraw %}' {{ sffs_sf_container }}
  register: sffs_sf_ip
  changed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined

- name: Adresse publique de StreamFusion (labels Traefik)
  ansible.builtin.shell:
    cmd: |
      set -o pipefail
      docker inspect -f '{% raw %}{{range $k, $v := .Config.Labels}}{{$k}}={{$v}}{{println}}{{end}}{% endraw %}' {{ sffs_sf_container }} \
        | grep -E '^traefik\.http\.routers\.[^.]+\.rule=' | grep -v -i admin | grep -o 'Host(`[^`]*`)' | head -1 | sed 's/Host(`\(.*\)`)/https:\/\/\1/'
    executable: /bin/bash
  register: sffs_sf_public
  changed_when: false
  failed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined

- name: Créer (ou retrouver) la clé d'API StreamFusion de sffs
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      P="docker exec stremio-postgres psql -U streamfusion -d streamfusion -qAtc"
      $P "insert into api_keys(api_key,is_active,never_expire,total_queries,name,proxied_links)
          select gen_random_uuid(),true,true,0,'sffs',false
          where not exists (select 1 from api_keys where name='sffs')"
      $P "select api_key from api_keys where name='sffs'"
    executable: /bin/bash
  register: sffs_sf_api_key
  changed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined
  no_log: true

- name: Clé AllDebrid de decypharr
  ansible.builtin.shell:
    cmd: |
      python3 -c 'import json,sys; c=json.load(open(sys.argv[1])); print(next(d["api_key"] for d in c.get("debrids",[]) if d.get("name")=="alldebrid" and d.get("api_key")))' \
        "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/decypharr/config/config.json"
    executable: /bin/bash
  register: sffs_ad_decypharr
  changed_when: false
  failed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined and (sffs_alldebrid_key | default('')) == ''
  no_log: true

- name: Demander la clé AllDebrid
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "sffs.alldebrid_key", "label": "Clé API AllDebrid", "kind": "secret", "secret": true}
      Entre ta clé API AllDebrid (https://alldebrid.com/apikeys)
    echo: false
  register: sffs_ad_prompt
  when:
    - sffs_known.SF_STREAM_CFG is not defined
    - (sffs_alldebrid_key | default('')) == ''
    - (sffs_ad_decypharr.stdout | default('')) == ''
  no_log: true

# Même chiffrement que la page /configure de StreamFusion (POST /api/config/encode).
- name: Générer la configuration StreamFusion de sffs
  ansible.builtin.command:
    argv: ["{{ sffs_dir }}/src/deploy/bin/sf-make-config.sh"]
  environment:
    SF_URL: "http://{{ sffs_sf_ip.stdout }}:8080"
    SF_PUBLIC: "{{ sffs_sf_public.stdout | default('', true) | trim or ('http://' ~ sffs_sf_ip.stdout ~ ':8080') }}"
    SF_API_KEY: "{{ sffs_sf_api_key.stdout | trim }}"
    AD_TOKEN: "{{ (sffs_alldebrid_key | default('', true)) or (sffs_ad_decypharr.stdout | default('', true)) or (sffs_ad_prompt.user_input | default('')) | trim }}"
    SF_LANGS: "{{ sffs_sf_langs | default('fr,multi') }}"
  register: sffs_cfg
  changed_when: false
  when: sffs_known.SF_STREAM_CFG is not defined
  no_log: true

- name: Retenir la configuration StreamFusion
  ansible.builtin.set_fact:
    sffs_known: >-
      {{ sffs_known | combine({
           'SF_STREAM_CFG': (sffs_cfg.stdout | regex_search('SF_STREAM_CFG=(\S+)', '\1') | first),
           'SF_PLAYBACK_CFG': (sffs_cfg.stdout | regex_search('SF_PLAYBACK_CFG=(\S+)', '\1') | first)
         }) }}
  when: sffs_known.SF_STREAM_CFG is not defined
  no_log: true

- name: Clé TMDB de StreamFusion
  ansible.builtin.set_fact:
    sffs_known: >-
      {{ sffs_known | combine({'SFFS_TMDB_KEY': (sffs_sf_env.stdout_lines | select('match', '^TMDB_API_KEY=')
         | map('regex_replace', '^TMDB_API_KEY=', '') | first | default(''))}) }}
  when: sffs_known.SFFS_TMDB_KEY is not defined
  no_log: true

- name: Demander la clé TMDB
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id": "sffs.tmdb_key", "label": "Clé TMDB", "kind": "secret", "secret": true}
      Entre ta clé API TMDB (v3), utilisée pour la liste des épisodes des séries
    echo: false
  register: sffs_tmdb_prompt
  when: sffs_known.SFFS_TMDB_KEY | length == 0
  no_log: true

- name: Retenir la clé TMDB saisie
  ansible.builtin.set_fact:
    sffs_known: "{{ sffs_known | combine({'SFFS_TMDB_KEY': sffs_tmdb_prompt.user_input | trim}) }}"
  when: sffs_known.SFFS_TMDB_KEY | length == 0
  no_log: true

- name: Générer le mot de passe du rôle Postgres en lecture seule
  ansible.builtin.set_fact:
    sffs_known: "{{ sffs_known | combine({'SFFS_DB_PASS': lookup('community.general.random_string', length=48, special=false)}) }}"
  when: sffs_known.SFFS_DB_PASS is not defined
  no_log: true

- name: Valider la configuration de sffs
  ansible.builtin.assert:
    that:
      - sffs_known.SF_STREAM_CFG | length > 20
      - sffs_known.SF_PLAYBACK_CFG | length > 20
      - sffs_known.SFFS_TMDB_KEY | length > 0
    fail_msg: "Configuration StreamFusion ou clé TMDB invalide : StreamFusion doit afficher des sources pour un film de test."
  no_log: true

- name: Enregistrer les secrets
  ansible.builtin.copy:
    content: "{{ sffs_known[item] }}\n"
    dest: "{{ sffs_secret_dir }}/{{ item }}"
    mode: "0600"
  loop: [SF_STREAM_CFG, SF_PLAYBACK_CFG, SFFS_TMDB_KEY, SFFS_DB_PASS]
  no_log: true

- name: Exposer les secrets au déploiement
  ansible.builtin.set_fact:
    SF_STREAM_CFG: "{{ sffs_known.SF_STREAM_CFG }}"
    SF_PLAYBACK_CFG: "{{ sffs_known.SF_PLAYBACK_CFG }}"
    SFFS_TMDB_KEY: "{{ sffs_known.SFFS_TMDB_KEY }}"
    SFFS_DB_PASS: "{{ sffs_known.SFFS_DB_PASS }}"
  no_log: true

# Rôle dédié dans la base StreamFusion : SELECT sur torrent_items uniquement.
- name: Créer ou mettre à jour le rôle sffs_reader
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      docker exec -i stremio-postgres psql --no-psqlrc -v ON_ERROR_STOP=1 \
        -v pass="$SFFS_DB_PASS" --username=streamfusion --dbname=streamfusion <<'SQL'
      SELECT format('CREATE ROLE sffs_reader LOGIN PASSWORD %L', :'pass')
        WHERE NOT EXISTS (SELECT 1 FROM pg_roles WHERE rolname = 'sffs_reader') \gexec
      SELECT format('ALTER ROLE sffs_reader WITH LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE NOINHERIT PASSWORD %L', :'pass') \gexec
      ALTER ROLE sffs_reader SET default_transaction_read_only = on;
      GRANT CONNECT ON DATABASE streamfusion TO sffs_reader;
      GRANT USAGE ON SCHEMA public TO sffs_reader;
      GRANT SELECT ON public.torrent_items TO sffs_reader;
      SQL
    executable: /bin/bash
  environment:
    SFFS_DB_PASS: "{{ SFFS_DB_PASS }}"
  changed_when: false
  no_log: true

# --- Définition de silo avec l'image modifiée -----------------------------------------------
# Écrite à partir de <storage>/vars/silo.yml s'il est personnel (gardé en silo.yml.avant-sffs),
# sinon de la définition du catalogue. Seules l'image et SILO_SF_ROOT changent.

- name: Écrire <storage>/vars/silo.yml (image modifiée)
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      own="{{ sffs_silo_vars }}" cat_="{{ settings.source }}/includes/dockerapps/vars/silo.yml"
      base="$cat_"
      if [ -f "$own" ] && ! grep -q '^# sffs-patch' "$own"; then cp -p "$own" "$own.avant-sffs"; fi
      [ -f "$own.avant-sffs" ] && base="$own.avant-sffs"
      python3 - "$base" "$own.tmp" <<'EOF'
      import re, sys
      src, dst = sys.argv[1], sys.argv[2]
      s = open(src).read()
      s = re.sub(r"(?m)^pull_image:.*\n", "", s)
      s, n = re.subn(r"(?m)^image:.*$", "image: 'localhost/silo-sffs:latest'\npull_image: false", s, count=1)
      assert n == 1, "image: introuvable"
      s, n = re.subn(r"(?m)^pg_env:\n", "pg_env:\n  # sffs : fichiers lus sans ffprobe, ouverts seulement au lancement d'une lecture.\n  SILO_SF_ROOT: '/mnt/sffs'\n", s, count=1)
      assert n == 1, "pg_env: introuvable"
      head = ("# sffs-patch : écrit par l'application sffs (image Silo modifiée). Supprimer sffs retire\n"
              "# ce fichier ; les autres réglages viennent de la définition de silo.\n")
      open(dst, "w").write(head + s)
      EOF
      if cmp -s "$own.tmp" "$own"; then rm -f "$own.tmp"; echo inchange; else mv "$own.tmp" "$own"; echo ecrit; fi
    executable: /bin/bash
  register: sffs_silo_vars_write
  changed_when: sffs_silo_vars_write.stdout == 'ecrit'
