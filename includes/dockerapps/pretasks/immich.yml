---

- name: Create a volume
  docker_volume:
    name: model-cache

- name: Vérifier si la base Immich contient déjà des données
  ansible.builtin.find:
    paths: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/postgres"
    file_type: any
    patterns: "PG_VERSION"
  register: immich_db_version
  changed_when: false

- name: Vérifier la présence du mot de passe persistant
  ansible.builtin.stat:
    path: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/secrets/db_password"
  register: immich_password_file

# Base existante sans fichier de secret : ancienne installation. On génère une
# valeur persistante puis on l'applique à PostgreSQL (ALTER USER) pour que
# l'application et la base restent cohérentes.
- name: Générer ou relire le mot de passe base Immich
  no_log: true
  ansible.builtin.set_fact:
    immich_db_password: >-
      {{ lookup('password', settings.storage + '/docker/' + lookup('env','USER')
         + '/immich-app/secrets/db_password length=32 chars=ascii_letters,digits') }}
    immich_db_migrate: >-
      {{ (immich_db_version.matched | default(0) > 0)
         and (not immich_password_file.stat.exists) }}


- name: Create immich-machine-learning
  no_log: true
  community.docker.docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: immich-machine-learning
    image: ghcr.io/immich-app/immich-machine-learning:release
    env:
      DB_PASSWORD: '{{ immich_db_password }}'
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_DATA_LOCATION: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/postgres"
      UPLOAD_LOCATION: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/library"
    volumes:
      - model-cache:/cache
    restart_policy: always
    networks:
      - name: traefik_proxy

- name: Create redis
  community.docker.docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: redis
    image: docker.io/redis:6.2-alpine@sha256:328fe6a5822256d065debb36617a8169dbfbd77b797c525288e465f56c1d392b
    healthcheck:
      test: redis-cli ping || exit 1
    restart_policy: always
    networks:
      - name: traefik_proxy

- name: Create database
  no_log: true
  community.docker.docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: database
    image: ghcr.io/immich-app/postgres:14-vectorchord0.4.3-pgvectors0.2.0@sha256:bcf63357191b76a916ae5eb93464d65c07511da41e3bf7a8416db519b40b1c23
    env:
      POSTGRES_PASSWORD: '{{ immich_db_password }}'
      POSTGRES_USER: postgres
      POSTGRES_DB: immich
      POSTGRES_INITDB_ARGS: '--data-checksums'
    volumes:
      - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/postgres:/var/lib/postgresql/data"
    healthcheck:
      test: pg_isready --dbname='immich' --username='postgres' || exit 1; Chksum="$$(psql --dbname='immich' --username='postgres' --tuples-only --no-align --command='SELECT COALESCE(SUM(checksum_failures), 0) FROM pg_stat_database')"; echo "checksum failure count is $$Chksum"; [ "$$Chksum" = '0' ] || exit 1
      interval: 5m
      start_interval: 30s
      start_period: 5m
    restart_policy: always
    networks:
      - name: traefik_proxy

- name: Aligner le mot de passe PostgreSQL sur une installation existante
  no_log: true
  community.docker.docker_container_exec:
    container: database
    command: >-
      psql -U postgres -d immich -c
      "ALTER USER postgres WITH PASSWORD '{{ immich_db_password }}'"
  register: immich_alter
  until: immich_alter.rc == 0
  retries: 30
  delay: 3
  changed_when: false
  when: immich_db_migrate | bool

- name: Define middleware chain
  set_fact:
    middleware_chain: >
      {% if sub[pgrole].auth == 'authelia' %}
      chain-authelia@file
      {% elif auth_enabled and sub[pgrole].auth == 'basique' %}
      chain-basic-auth@file
      {% elif auth_enabled and sub[pgrole].auth == 'oauth' %}
      chain-oauth@file
      {% elif auth_enabled and sub[pgrole].auth == 'aucune' %}
      chain-no-auth@file
      {% else %}
      ''
      {% endif %}

- name: Create immich_server
  no_log: true
  community.docker.docker_container:
    name: immich_server
    image: ghcr.io/immich-app/immich-server:release
    env:
      DB_PASSWORD: '{{ immich_db_password }}'
      DB_USERNAME: postgres
      DB_DATABASE_NAME: immich
      DB_DATA_LOCATION: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/postgres"
      UPLOAD_LOCATION: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/library"
    labels:
      ssdv2.app: "{{pgrole}}"
      traefik.enable: "true" 
      traefik.http.routers.immich.entrypoints: "https"
      traefik.http.routers.immich.rule: "Host(`{{sub[pgrole][pgrole] if sub_enabled else pgrole}}.{{user.domain}}`)"
      traefik.http.routers.immich.tls: "true"
      traefik.http.routers.immich.tls.certresolver: "letsencrypt"
      traefik.http.routers.immich.middlewares: "{{ middleware_chain }}"
    volumes:
      - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/immich-app/library:/data"
      - /etc/localtime:/etc/localtime:ro
    ports:
      - 2283:2283
    restart_policy: always
    networks:
      - name: traefik_proxy
