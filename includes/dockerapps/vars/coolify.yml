---
pgrole: 'coolify'
image: 'ghcr.io/coollabsio/coolify:latest'

# Secrets persistants : générés une fois, relus à chaque réinstallation.
coolify_secret_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/coolify/secrets"

pg_env:
  APP_ID: "{{ lookup('password', coolify_secret_dir + '/app_id length=32 chars=hexdigits') }}"
  APP_KEY: "base64:{{ lookup('password', coolify_secret_dir + '/app_key length=64 chars=ascii_letters,digits') }}"
  DB_USERNAME: "coolify"
  DB_PASSWORD: "{{ lookup('password', coolify_secret_dir + '/db_password length=64 chars=ascii_letters,digits') }}"
  DB_DATABASE: "coolify"
  REDIS_PASSWORD: "{{ lookup('password', coolify_secret_dir + '/redis_password length=64 chars=ascii_letters,digits') }}"
  PUSHER_APP_ID: "{{ lookup('password', coolify_secret_dir + '/pusher_app_id length=64 chars=hexdigits') }}"
  PUSHER_APP_KEY: "{{ lookup('password', coolify_secret_dir + '/pusher_app_key length=64 chars=hexdigits') }}"
  PUSHER_APP_SECRET: "{{ lookup('password', coolify_secret_dir + '/pusher_app_secret length=64 chars=hexdigits') }}"
  LETSENCRYPT_EMAIL: "{{ user.mail }}"
  APP_ENV: "local"
  APP_NAME: "Coolify"
  APP_PORT: "8000"
  APP_DEBUG: "true"
  SSH_MUX_ENABLED: "true"

labels:
  traefik.enable: "true" 
  traefik.http.routers.coolify-app.entrypoints: "https"
  traefik.http.routers.coolify-app.rule: "Host(`{{sub[pgrole][pgrole] if sub_enabled else pgrole}}.{{user.domain}}`)"
  traefik.http.routers.coolify-app.tls: "true"
  traefik.http.routers.coolify-app.tls.certresolver: "letsencrypt"
  ## Middlewares
  traefik.http.routers.coolify-app.middlewares: "{{ 'chain-authelia@file' if auth_enabled and sub[pgrole].auth == 'authelia' | default(false)
  else 'chain-basic-auth@file' if auth_enabled and sub[pgrole].auth == 'basique' | default(false)
  else 'chain-oauth@file' if auth_enabled and sub[pgrole].auth == 'oauth' | default(false) 
  else 'chain-no-auth@file' if auth_enabled and sub[pgrole].auth == 'aucune'}}"

  traefik.http.routers.coolify-app.service: "coolify-svc"
  traefik.http.services.coolify-svc.loadbalancer.server.port: "8080"


docker_deploy_enabled: false
traefik_labels_enabled: false


