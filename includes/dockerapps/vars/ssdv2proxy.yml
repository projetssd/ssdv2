---
# SSDv2 Proxy Manager — gestion centralisée des manifestes Stremio.
# Interface Web avec son propre login ; les routes consommées par Stremio
# (/u/..., /play, anciennes URLs /<id>/...) restent publiques.
# Login : identifiant SSDV2 (user.name) + mot de passe dédié demandé à
# l'installation, conservé en 0600 dans conf/.
# Le playbook générique connecte ce conteneur à traefik_proxy : il peut donc
# joindre le relais SSDV2 sur http://ssdv2-relay:1080 pour le laboratoire AllDebrid.
pgrole: 'ssdv2proxy'
intport: '7000'
image: 'ghcr.io/projetssd/ssdv2-proxy-manager:latest'
docker_no_log: true

pg_volumes:
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}:/app/data:rw"

pg_env:
  PORT: '7000'
  DATA_DIR: '/app/data'
  NODE_ENV: 'production'
  PUBLIC_URL: "https://{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}"
  AUTH_USER: "{{ user.name }}"
  # Login propre à l'application (distinct de SSDV2 et de Traefik).
  # Le mot de passe est demandé à l'installation (12 caractères minimum, exigés
  # par l'administration des VPN) puis conservé en 0600 hors du dossier
  # applicatif, celui-ci appartenant à l'UID du conteneur. Pour le changer :
  # supprimer {{ settings.storage }}/conf/{{ pgrole }}.auth puis réinstaller.
  AUTH_PASS: "{{ lookup('file', settings.storage + '/conf/' + pgrole + '.auth') | trim }}"
  TZ: 'Europe/Paris'
  # Proxy par défaut créé au premier démarrage (migration initiale).
  # Mettre socks / socks5://warp:1080 pour créer un profil SOCKS5 par défaut.
  # Ensuite, les proxies se gèrent dans l'onglet Proxies de l'application.
  UPSTREAM_MODE: 'direct'
  UPSTREAM_URL: ''
  # Relais AllDebrid détecté automatiquement sur le réseau traefik_proxy.
  SSDV2_RELAY_URL: 'http://ssdv2-relay:1080'
  # Gestion des VPN natifs (WireGuard/OpenVPN) depuis l'interface.
  # L'application refuse ces routes si le drapeau est absent ou si AUTH_PASS
  # fait moins de 12 caractères. Les passerelles sont lancées par le contrôleur
  # privilégié ssdv2-vpn-controller déployé par posttasks/ssdv2proxy.yml.
  # Les proxies VPN sont accessibles aux applications sur traefik_proxy,
  # avec authentification, sans port publié sur l’hôte.
  VPN_MANAGER_ENABLED: 'true'

# Les routes consommées par Stremio doivent rester publiques. L'interface et
# l'API de gestion restent protégées par Traefik (si activé) et par le login
# propre de l'application. Choisir « aucune » dans SSDV2 évite la double auth.
extra_labels:
  traefik.http.routers.ssdv2proxy-public-rtr.entrypoints: 'http,https'
  traefik.http.routers.ssdv2proxy-public-rtr.rule: "Host(`{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}`) && (Path(`/play`) || PathPrefix(`/u/`) || PathRegexp(`^/[a-f0-9]+/`))"
  traefik.http.routers.ssdv2proxy-public-rtr.priority: '100'
  traefik.http.routers.ssdv2proxy-public-rtr.tls: 'true'
  traefik.http.routers.ssdv2proxy-public-rtr.tls.certresolver: 'letsencrypt'
  traefik.http.routers.ssdv2proxy-public-rtr.middlewares: 'chain-no-auth@file'
  traefik.http.routers.ssdv2proxy-public-rtr.service: 'ssdv2proxy-svc'
