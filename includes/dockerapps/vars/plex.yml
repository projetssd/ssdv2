---
- hosts: localhost
  gather_facts: true
  vars_files:
    - "{{ lookup('env','HOME') }}/.ansible/inventories/group_vars/all.yml"
    - "{{ settings.source }}/includes/dockerapps/templates/plex/tasks/settings.yml"
    - "{{ settings.source }}/includes/dockerapps/templates/plex/defaults/main.yml"


  tasks:

    - name: 'Set Known Facts'
      set_fact:
        pgrole: 'plex'

    - name: "Variables | Set 'cloudflare_enabled' variable"
      set_fact:
        cloudflare_enabled: "{{ true if not(
            (cloudflare.login is undefined)
            or
            (cloudflare.login is none)
            or
            (cloudflare.login | trim | length == 0)
            or
            (cloudflare.api is undefined)
            or
            (cloudflare.api is none)
            or
            (cloudflare.api | trim | length == 0)
          )
            else false }}"

    - name: "Variables | Set 'plex_account_enabled' variable"
      set_fact:
        plex_account_enabled: "{{ true if not(
            (plex.token is undefined)
            or
            (plex.token is none)
            or
            (plex.token | trim | length == 0)
          )
          else false }}"

    - name: "Variables | Set 'sub' variable"
      set_fact:
        sub_enabled: "{{ true if not(
            (sub[pgrole][pgrole] is undefined)
            or
            (sub[pgrole][pgrole] is none)
            or
            (sub[pgrole][pgrole] | trim | length == 0)
          )
            else false }}"


    - name: "Set DNS Record on CloudFlare"
      include_tasks: "{{ settings.source }}/includes/config/roles/cloudflare/tasks/main.yml"
      vars:
        subdomain: "{{sub[pgrole][pgrole] if sub_enabled else pgrole}}"
        # Mode public HTTPS : DNS-only (gris) pour laisser les clients Plex
        # se connecter directement a Traefik, sans proxy Cloudflare.
        proxied: "{{ not plex_public_https }}"
      when: cloudflare_enabled

    - name: "Create Plex directories"
      become: yes
      file: "path={{ item }} state=directory mode=0775 owner={{ lookup('env','MYUID') }} group={{ lookup('env','MYGID')}}"
      with_items: "{{ plex_folders }}"

    - name: "Stop and remove any existing container"
      docker_container:
        name: plex
        state: absent

    - name: "Pull Plex Docker image"
      community.docker.docker_image:
        name: "{{ plex_docker_image }}"
        source: pull
        state: present

    - name: "Check if '/dev/dri' exists"
      stat:
        path: "/dev/dri"
      register: dev_dri

    - name: "Check if 'Preferences.xml' exists"
      stat:
        path: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/plex/config/Library/Application Support/Plex Media Server/Preferences.xml"
      register: preferences_xml

    - name: "'Preferences.xml' Tasks"
      block:

      - name: Get 'Preferences.xml' XML data
        xml:
          path: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/plex/config/Library/Application Support/Plex Media Server/Preferences.xml"
          xpath: /Preferences
          content: attribute
        register: preferences_xml_resp
        ignore_errors: yes

      - name: "Backup 'Preferences.xml' before abort"
        copy:
          src: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/plex/config/Library/Application Support/Plex Media Server/Preferences.xml"
          dest: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/plex/config/Library/Application Support/Plex Media Server/Preferences.xml.bak-{{ ansible_facts['date_time']['iso8601_basic_short'] }}"
          remote_src: true
        when: (preferences_xml_resp is failed)

      - name: "Abort if 'Preferences.xml' cannot be read"
        fail:
          msg: >-
            Impossible de lire 'Preferences.xml' (XML invalide, permissions ou lxml indisponible).
            Aucune modification de Preferences.xml n'a été effectuée. Une sauvegarde .bak-* a été créée.
            Le conteneur Plex a été arrêté par le playbook ; corrigez la cause puis relancez.
        when: (preferences_xml_resp is failed)

      - name: Set 'transcoder_path_fix' variable
        set_fact:
          transcoder_path_fix: "{{ (preferences_xml_resp is succeeded) and
            (preferences_xml_resp.matches[0].Preferences.TranscoderTempDirectory is defined) and
            (preferences_xml_resp.matches[0].Preferences.TranscoderTempDirectory | trim == '/transcodes') }}"

      - name: "Fix 'TranscoderTempDirectory'"
        xml:
          path: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/plex/config/Library/Application Support/Plex Media Server/Preferences.xml"
          xpath: /Preferences
          attribute: TranscoderTempDirectory
          value: "/transcode"
          state: present
        ignore_errors: yes
        when: (transcoder_path_fix)

      - name: Set 'plex_server_claimed' variable
        set_fact:
          plex_server_claimed: "{{ (preferences_xml_resp is succeeded) and
            (preferences_xml_resp.matches[0].Preferences.PlexOnlineToken is defined) and
            (preferences_xml_resp.matches[0].Preferences.PlexOnlineToken | trim | length > 0) }}"

      when:
        - (preferences_xml.stat.exists)

    - name: Claim Plex Server
      import_tasks: "{{ lookup('env','SETTINGS_SOURCE') }}/includes/dockerapps/templates/plex/tasks/subtasks/claim_server.yml"
      when:
        - (not preferences_xml.stat.exists) or (preferences_xml.stat.exists and not plex_server_claimed)

    - name: 'Set Default Labels'
      set_fact:
        default_labels:
          traefik.enable: 'true'
          ## HTTP Routers
          traefik.http.routers.plex-rtr.entrypoints: "{{ 'https' if plex_public_https | bool else 'http,https' }}"
          traefik.http.routers.plex-rtr.rule: 'Host(`{{sub[pgrole][pgrole] if sub_enabled else pgrole}}.{{user.domain}}`)'
          traefik.http.routers.plex-rtr.tls: 'true'
          traefik.http.routers.plex-rtr.service: 'plex-svc'
          traefik.http.routers.plex-rtr.tls.certresolver: 'letsencrypt'
          traefik.http.routers.plex-rtr.middlewares: "{{ 'chain-plex@file' if plex_public_https | bool else 'chain-no-auth@file' }}"
          ## HTTP Services
          traefik.http.services.plex-svc.loadbalancer.server.port: '32400'

    - name: 'Set Public HTTPS Labels'
      set_fact:
        default_labels: "{{ default_labels | combine({
          'traefik.http.services.plex-svc.loadbalancer.server.scheme': 'https',
          'traefik.http.services.plex-svc.loadbalancer.serverstransport': 'plex-transport@file'
        }) }}"
      when: plex_public_https | bool

    - name: "Create and start container"
      docker_container:
        name: plex
        image: "{{ plex_docker_image }}"
        pull: yes
        published_ports: "{{ plex_published_ports }}"
        env:
          PUID: "{{ lookup('env','MYUID')}}"
          PGID: "{{ lookup('env','MYGID')}}"
          PLEX_CLAIM: "{{ (plex_claim_code) | default(omit) }}"
          VERSION: "latest"
          TZ: "Europe/Paris"
        volumes: "{{ plex_docker_volumes }}"
        security_opts: "{{ plex_security_opts }}"
        cap_drop: "{{ plex_cap_drop }}"
        capabilities: "{{ plex_cap_add }}"
        tmpfs: "{{ plex_tmpfs }}"
        shm_size: "{{ plex_shm_size }}"
        devices: "{{ '/dev/dri:/dev/dri' if (gpu.intel and dev_dri.stat.exists) | default(false) else omit }}"
        etc_hosts: "{{ plex_docker_hosts }}"
        networks:
          - name: traefik_proxy
        restart_policy: unless-stopped
        state: started
        labels: "{{ default_labels }}"

    # Sometimes docker will set transcodes folder to root after a restore.
    - name: "Ensure transcodes folder has the correct permissions"
      become: yes
      file:
        path: "{{ plex.transcodes }}"
        owner: "{{ lookup('env','MYUID') }}"
        group: "{{ lookup('env','MYGID') }}"
        mode: 0775
        recurse: yes

    - name: Extra Tasks
      import_tasks: "{{ settings.source }}/includes/dockerapps/templates/plex/tasks/subtasks/extra.yml"
      ignore_errors: yes

    - name: "Wait for Plex to be ready for Remote Access configuration"
      wait_for:
        port: 32400
        host: 127.0.0.1
        timeout: 300

    # Le backend est en HTTPS local. On utilise validate_certs=no car le
    # certificat Plex est un certificat plex.direct. secureConnections=0
    # (Required) est applique en meme temps : l'API HTTP locale peut refuser
    # la connexion selon la version de Plex.
    - name: "Set Plex remote access preferences"
      vars:
        plex_custom_url: "https://{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}"
        plex_extra_prefs: "{{ '&secureConnections=0&RelayEnabled=0&PublishServerOnPlexOnlineKey=1' if plex_public_https | bool else '' }}"
      uri:
        url: "https://127.0.0.1:32400/:/prefs?customConnections={{ plex_custom_url | urlencode }}&ManualPortMappingMode=0&ManualPortMappingPort=0{{ plex_extra_prefs }}"
        method: PUT
        validate_certs: no
        headers:
          X-Plex-Token: "{{ plex.token }}"
      register: custom_connections_resp
      retries: 5
      delay: 5
      until: custom_connections_resp.status == 200
      when: plex_account_enabled

    - name: Insert plex into database
      shell :
        cmd: |
          sqlite3 {{  settings.source }}/ssddb << EOF
              replace into applications (name,status,subdomain,port)
              values
              ('plex',2,'{{sub[pgrole][pgrole] if sub_enabled else pgrole}}',32400);
          EOF

