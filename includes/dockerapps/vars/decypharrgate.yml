---
# Passerelle interne entre Sonarr v5+ et une instance decypharr.
# Aucun port publie, aucun DNS, aucun label Traefik : le conteneur n'est
# joignable que depuis le reseau Docker traefik_proxy.
#
# La configuration nginx est generee par la pretask dans le dossier de l'app
# (upstream detecte/choisi), puis montee ici. Cela permet plusieurs gates,
# une par instance decypharr.
pgrole: 'decypharrgate'
image: 'openresty/openresty:1.27.1.2-alpine'
traefik_labels_enabled: false

pg_volumes:
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}:/etc/nginx/conf.d:ro"

specific_docker_info:
  restart_policy: unless-stopped
  healthcheck:
    test: ["CMD-SHELL", "wget -qO- http://127.0.0.1:8282/api/v2/app/version >/dev/null || exit 1"]
    interval: 30s
    timeout: 5s
    retries: 3
    start_period: 10s
