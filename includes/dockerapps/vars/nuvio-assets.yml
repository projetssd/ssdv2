---
pgrole: 'nuvio-assets'
intport: '8787'
image: 'ghcr.io/xnzx07/nuvio-assets:latest'

pg_volumes:
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/donnees:/data:rw"

pg_env:
  TMDB_API_KEY: "{{ lookup('file', settings.storage ~ '/conf/' ~ pgrole ~ '.tmdb-key') | trim }}"
  GEMINI_API_KEY: "{{ lookup('file', settings.storage ~ '/conf/' ~ pgrole ~ '.gemini-key', errors='ignore') | default('', true) | trim }}"
  ADMIN_PASSWORD: "{{ lookup('password', settings.storage ~ '/conf/' ~ pgrole ~ '.admin-password length=24 chars=ascii_letters,digits') }}"
  ADRESSE_PUBLIQUE: "https://{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}"
  TZ: 'Europe/Paris'

specific_docker_info:
  log_driver: json-file
  log_options:
    max-size: "1m"
    max-file: "3"
