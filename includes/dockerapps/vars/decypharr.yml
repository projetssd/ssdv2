---
pgrole: 'decypharr'
intport: '8282'
image: 'cy01/blackhole:latest'
pg_volumes:
  - "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/decypharr/config:/app"
  - "{{ lookup('env','HOME') }}:{{ lookup('env','HOME') }}:rw"
  - "/mnt:/mnt:rshared"
pg_env:
  PUID: "{{ lookup('env','MYUID') }}"
  PGID: "{{ lookup('env','MYGID') }}"
specific_docker_info:
  devices:
    - '/dev/fuse:/dev/fuse:rwm'
  capabilities:
    - SYS_ADMIN
    - NET_ADMIN 
  security_opts:
    - apparmor:unconfined
  ports:
    - "8282:8282"
  restart_policy: "always"
  healthcheck:
    test: >
      /bin/sh -c "
      wget -qO- --timeout=2 http://localhost:8282/version >/dev/null || exit 1
      "
    interval: "30s"
    timeout: "10s"
    retries: 3
    start_period: "10s"