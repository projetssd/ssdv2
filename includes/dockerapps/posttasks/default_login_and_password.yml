---
- name: Display default login and password
  debug:
    msg:
      - "Default Login: {{ dlogin }}"
      - "Default Password: {{ dpasswd }}"

- name: Wait for user to press Enter to continue
  pause:
    prompt: |
      SSDV2_PROMPT {"id": "common.press_enter", "label": "Appuyer sur Entrée pour continuer", "kind": "confirm", "secret": false}
      Press Enter to continue...
