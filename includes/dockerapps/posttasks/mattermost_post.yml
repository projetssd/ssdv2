---
- name: 'Stop {{ pgrole }}'
  docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: '{{ pgrole }}'
    state: stopped

- name: Change directory rights
  become: yes
  command:
    cmd: "chmod -R 777 {{ settings.storage }}/docker/{{user.name}}/{{pgrole}}"

- name: 'Deploying {{pgrole}}'
  docker_container: "{{ docker_info }}"
