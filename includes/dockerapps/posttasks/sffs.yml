---
# Posttask sffs : sffs est démarré. Il ne reste qu'à créer la clé d'API de sffs dans
# l'application silosffs (Silo patché, installé séparément). Aucun conteneur n'est créé ici.

- name: Chemins de sffs
  ansible.builtin.set_fact:
    sffs_secret_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/sffs-secrets"

- name: Attendre que silosffs réponde
  ansible.builtin.command: docker exec silosffs curl -sf http://localhost:8080/api/v1/health
  register: sffs_silo_health
  until: sffs_silo_health.rc == 0
  retries: 120
  delay: 10
  changed_when: false

- name: Un compte admin existe-t-il dans silosffs ?
  ansible.builtin.command: >-
    docker exec db-silosffs psql -U silo -d silo -qAtc
    "select count(*) from users where role = 'admin' and enabled"
  register: sffs_silo_admin
  changed_when: false
  failed_when: false

- name: Refuser sffs sans compte admin dans silosffs
  ansible.builtin.fail:
    msg: >-
      silosffs n'a pas de compte admin actif. Terminer l'installation de silosffs
      (créer le compte admin dans son interface web), puis relancer sffs.
  when: sffs_silo_admin.rc != 0 or sffs_silo_admin.stdout | trim | int == 0

# sffs demande à silosffs un scan ciblé des dossiers modifiés : il lui faut une clé d'API admin.
# Elle est créée dès qu'un compte admin existe ; sffs relit le fichier sans redémarrer.
- name: Clé d'API de sffs déjà créée ?
  ansible.builtin.stat:
    path: "{{ sffs_secret_dir }}/SFFS_SILO_KEY"
  register: sffs_key_file

- name: Créer la clé d'API de sffs dans silosffs
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      P="docker exec db-silosffs psql -U silo -d silo -qAtc"
      admin=$($P "select id from users where role = 'admin' and enabled order by id limit 1")
      [ -n "$admin" ] || { echo pas-d-admin; exit 1; }
      key="sa_$(openssl rand -hex 32)"
      hash=$(printf %s "$key" | sha256sum | cut -d' ' -f1)
      $P "delete from api_keys where label = 'sffs'" >/dev/null
      $P "insert into api_keys(user_id,label,key_hash,key_prefix,scopes) values ($admin,'sffs','$hash','${key:0:11}','{}')" >/dev/null
      umask 077
      printf '%s\n' "$key" > "{{ sffs_secret_dir }}/SFFS_SILO_KEY"
      echo cree
    executable: /bin/bash
  register: sffs_key
  changed_when: sffs_key.stdout == 'cree'
  when: not sffs_key_file.stat.exists or sffs_key_file.stat.size == 0
  no_log: true

- name: Adresse de silosffs
  ansible.builtin.shell: >-
    bash "{{ settings.source }}/includes/config/scripts/generique.sh" get_from_account_yml sub.silosffs.silosffs 2>/dev/null | tail -1
  register: sffs_silo_sub
  changed_when: false

# Le montage FUSE peut prendre plusieurs minutes au premier démarrage : sffs
# charge StreamFusion et construit son arborescence avant de monter /mnt/sffs.
- name: Attendre le montage /mnt/sffs
  ansible.builtin.command: test -d /mnt/sffs/films -a -d /mnt/sffs/series
  register: sffs_mount_ready
  until: sffs_mount_ready.rc == 0
  retries: 180
  delay: 10
  changed_when: false
  when: sffs_catalog_seed | bool

- name: Le catalogue silosffs contient-il déjà des médias ?
  ansible.builtin.command: >-
    docker exec db-silosffs psql -U silo -d silo -qAtc
    "select count(*) from media_items"
  register: sffs_catalog_items
  changed_when: false
  when: sffs_catalog_seed | bool

- name: Générer le seed du catalogue depuis l'arborescence sffs
  ansible.builtin.command:
    argv:
      - python3
      - "{{ settings.source }}/includes/config/scripts/silo_catalog_seed.py"
      - --films-dir
      - /mnt/sffs/films
      - --series-dir
      - /mnt/sffs/series
      - --output
      - /tmp/silo-catalog-seed.json.gz
  register: sffs_catalog_seed_run
  when:
    - sffs_catalog_seed | bool
    - sffs_catalog_items.stdout | default('0') | trim | int == 0

- name: Copier le seed dans silosffs
  ansible.builtin.command: >-
    docker cp /tmp/silo-catalog-seed.json.gz
    silosffs:/tmp/silo-catalog-seed.json.gz
  when: sffs_catalog_seed_run is changed

- name: Importer le catalogue dans silosffs
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      key=$(cat "{{ sffs_secret_dir }}/SFFS_SILO_KEY")
      set +e
      printf '%s\n' "$key" | docker exec -i silosffs sh -c 'IFS= read -r k; curl -sS --max-time 1800 -o /tmp/silo-catalog-import.out -w "%{http_code}" -X POST -H "Authorization: Bearer $k" -H "Content-Type: application/json" --data-binary "{\"local_path\":\"/tmp/silo-catalog-seed.json.gz\",\"conflict_mode\":\"skip_existing\",\"path_rewrites\":[]}" http://localhost:8080/api/v2/admin/catalog/import'
      rc=$?
      set -e
      count=$(docker exec db-silosffs psql -U silo -d silo -qAtc "select count(*) from media_items")
      if [ "${count:-0}" -eq 0 ]; then
        echo "import du catalogue en échec (curl rc=$rc)" >&2
        docker exec silosffs cat /tmp/silo-catalog-import.out >&2 || true
        exit 1
      fi
      echo "catalogue importé: ${count} médias (curl rc=$rc)"
    executable: /bin/bash
  when: sffs_catalog_seed_run is changed
  no_log: true

- name: Rafraîchir les métadonnées des bibliothèques importées
  ansible.builtin.shell:
    cmd: |
      set -euo pipefail
      key=$(cat "{{ sffs_secret_dir }}/SFFS_SILO_KEY")
      for id in $(docker exec db-silosffs psql -U silo -d silo -qAtc "select id from media_folders where name in ('Films','Séries') order by id"); do
        printf '%s\n' "$key" | docker exec -i silosffs sh -c 'IFS= read -r k; id="$1"; curl -sS -f -o /dev/null -X POST -H "Authorization: Bearer $k" -H "Content-Type: application/json" -d "{\"mode\":\"full\"}" "http://localhost:8080/api/v2/libraries/$id/refresh-metadata"' _ "$id"
      done
    executable: /bin/bash
  when:
    - sffs_catalog_seed_refresh_metadata | bool
    - sffs_catalog_seed_run is changed
  no_log: true

- name: Nettoyer le seed local
  ansible.builtin.file:
    path: /tmp/silo-catalog-seed.json.gz
    state: absent
  when: sffs_catalog_seed_run is changed

- name: Nettoyer le seed dans silosffs
  ansible.builtin.command: docker exec silosffs rm -f /tmp/silo-catalog-seed.json.gz
  when: sffs_catalog_seed_run is changed
  changed_when: false

- name: sffs prêt
  ansible.builtin.debug:
    msg:
      - "silosffs : https://{{ sffs_silo_sub.stdout | default('silosffs', true) | trim }}.{{ user.domain }}"
      - "Catalogue initial : import d'un seed depuis /mnt/sffs (pas de scan complet) ; métadonnées et affiches récupérées en arrière-plan."
      - "Cache TMDB persistant : {{ sffs_cache_dir }} (conservé lors des réinstallations)."
      - "Mise à jour : scans ciblés des dossiers modifiés par sffs ; rien n'est téléchargé."
