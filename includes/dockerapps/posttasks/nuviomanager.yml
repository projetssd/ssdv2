---
# Attend que l'application réponde, puis affiche les instructions d'accès.
# Idempotent (skill SSDV2) : on n'attend rien d'unique au premier démarrage
# (les versions récentes n'utilisent plus de « code de configuration »).

- name: Attendre que l'application réponde
  ansible.builtin.shell: docker exec {{ pgrole }} wget -qO- http://127.0.0.1:3100/api/setup 2>/dev/null || true
  register: nuviomanager_state
  changed_when: false
  failed_when: false
  retries: 15
  delay: 2
  until: "'required' in nuviomanager_state.stdout"

- name: Afficher les instructions d'installation
  ansible.builtin.debug:
    msg:
      - "=============================================="
      - "NUVIO MANAGER - INSTALLATION TERMINEE"
      - "=============================================="
      - "URL : https://{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}"
      - "Authentification SSDV2 : {{ sub[pgrole].auth | default('aucune', true) }}"
      - ""
      - "Première ouverture : crée le compte administrateur (nom, mot de passe, adresse publique)."
      - "Aucun code de configuration n'est requis (versions récentes)."
      - "=============================================="
