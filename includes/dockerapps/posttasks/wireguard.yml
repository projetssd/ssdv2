---
- name: Attendre le premier QR code WireGuard
  ansible.builtin.wait_for:
    path: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/config/peer1/peer1.png"
    timeout: 60

- name: Indiquer comment afficher le QR code WireGuard
  ansible.builtin.debug:
    msg: "Le QR code est disponible depuis la fiche WireGuard de la WebUI ; il est affiché directement en installation CLI interactive."
