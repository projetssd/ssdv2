---
# Instructions après installation : le compte administrateur est créé par
# l'assistant /setup. Le jeton est écrit par l'application au premier démarrage
# et conservé dans son volume de données jusqu'à la création du compte (il est
# ensuite supprimé). Il n'est jamais affiché ni journalisé : seul le chemin du
# fichier, restreint en 0600, est indiqué à l'utilisateur.

- name: Définir l'URL et le dossier de données de Symlink
  ansible.builtin.set_fact:
    symlink_url: "https://{{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}"
    symlink_data_dir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{ pgrole }}/data"

# Réinstallation : si la base existe déjà, le compte a été initialisé et le jeton
# de premier démarrage ne sera pas régénéré.
- name: Vérifier si l'instance Symlink a déjà démarré
  ansible.builtin.stat:
    path: "{{ symlink_data_dir }}/{{ pgrole }}.sqlite3"
  register: symlink_existing_db

- name: Vérifier la présence du jeton d'installation
  ansible.builtin.stat:
    path: "{{ symlink_data_dir }}/setup-token"
  register: symlink_token_file

# Premier démarrage uniquement : on attend brièvement que l'application écrive
# le jeton. En réinstallation (base existante), on n'attend pas.
- name: Attendre le jeton d'installation (premier démarrage)
  ansible.builtin.wait_for:
    path: "{{ symlink_data_dir }}/setup-token"
    timeout: 60
  register: symlink_token_wait
  failed_when: false
  changed_when: false
  when:
    - not (symlink_existing_db.stat.exists | default(false))
    - not symlink_token_file.stat.exists

- name: Relire la présence du jeton
  ansible.builtin.stat:
    path: "{{ symlink_data_dir }}/setup-token"
  register: symlink_token_final

- name: Restreindre l'accès au jeton d'installation
  ansible.builtin.file:
    path: "{{ symlink_data_dir }}/setup-token"
    mode: '0600'
  when: symlink_token_final.stat.exists

- name: Afficher les instructions de premier démarrage
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "SYMLINK - INSTALLATION TERMINEE"
      - "=================================================="
      - "URL : {{ symlink_url }}"
      - "Authentification SSDV2 : {{ sub[pgrole].auth | default('aucune', true) }}"
      - ""
      - "Assistant /setup : création du compte administrateur"
      - "  1. Ouvrez {{ symlink_url }}/setup"
      - "  2. Jeton d'installation : {{ symlink_data_dir }}/setup-token"
      - "     (fichier en 0600 : sudo cat {{ symlink_data_dir }}/setup-token)"
      - "  3. Identifiant + mot de passe (>= 12 caractères)."
      - ""
      - "Ensuite, dans l'interface : Radarr/Sonarr (URL + clé API), import Radarr, AllDebrid."
      - "=================================================="
  when: symlink_token_final.stat.exists

- name: Afficher les instructions (compte déjà initialisé)
  ansible.builtin.debug:
    msg:
      - "=================================================="
      - "SYMLINK - INSTALLATION TERMINEE"
      - "=================================================="
      - "URL : {{ symlink_url }}"
      - "Aucun jeton d'installation : un compte administrateur existe déjà"
      - "(ou SYMLINK_ADMIN_PASSWORD est fourni). Connectez-vous directement."
      - "=================================================="
  when: not symlink_token_final.stat.exists
