---
- name: prepare directory
  become: yes
  file:
    path: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{pgrole}}/db-{{pgrole}}/init"
    state: directory
    mode: 0777
    owner: "{{ lookup('env','MYUID') }}"
    group: "{{ lookup('env','MYGID') }}"

# La génération du schéma peut échouer selon l'architecture (image amd64).
# On isole cette étape fragile pour ne pas interrompre l'installation
# (sinon : conteneur + DNS créés mais ni registre ni entrée SQLite).
- name: Préparer le schéma de base de données
  block:
    - name: Prepare database dump
      shell:
        chdir: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{pgrole}}/db-{{pgrole}}/init"
        cmd: "docker run --rm guacamole/guacamole /opt/guacamole/bin/initdb.sh --mysql > /tmp/initdb.sql"

    - name: Copy file
      become: yes
      copy:
        src: /tmp/initdb.sql
        dest: "{{ settings.storage }}/docker/{{ lookup('env','USER') }}/{{pgrole}}/db-{{pgrole}}/init/initdb.sql"
  rescue:
    - name: Avertissement (schéma non généré)
      debug:
        msg:
          - "Impossible de générer le schéma guacamole (image incompatible avec l'architecture ?)."
          - "L'installation continue ; la base devra être initialisée manuellement."


- name: Launch Pretask
  include_tasks: "{{ settings.source }}/includes/dockerapps/templates/generique/mariadb_officiel.yml"

- name: Wait for database to be up
  wait_for:
    timeout: 30

- name: 'Deploying guacd'
  docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: 'guacd'
    image: "guacamole/guacd"
    restart_policy: unless-stopped
    networks:
    - name: traefik_proxy
    state: started

- name: DEBUG - Installation guacamole
  ansible.builtin.debug:
    msg:
      - "=============================="
      - "INSTALLATION GUACAMOLE"
      - "=============================="
      - ""
      - "Nom d’utilisateur : guacadmin"
      - "Mot de passe : guacadmin"
      - ""
      - "  • -> {{ sub[pgrole][pgrole] if sub_enabled else pgrole }}.{{ user.domain }}/guacamole"

