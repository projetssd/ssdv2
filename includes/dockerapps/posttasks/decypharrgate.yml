---
# Post-installation de decypharrgate (gate par defaut ou gate custom).
# - attend que la gate soit prete ;
# - recharge nginx ;
# - propose de configurer les Sonarr v5+ eligibles ;
# - propose d'augmenter le cache DFS de l'upstream.

- name: Attendre que {{ pgrole }} soit pret
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ pgrole }}"
      - wget
      - -qO-
      - http://127.0.0.1:8282/api/v2/app/version
  register: decypharrgate_version
  until: decypharrgate_version.rc == 0
  retries: 30
  delay: 2
  changed_when: false
  failed_when: false

- name: Verifier la configuration nginx de {{ pgrole }}
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ pgrole }}"
      - nginx
      - -t
  register: decypharrgate_nginx_test
  changed_when: false
  failed_when: false

- name: Recharger nginx de {{ pgrole }}
  ansible.builtin.command:
    argv:
      - docker
      - exec
      - "{{ pgrole }}"
      - nginx
      - -s
      - reload
  when: decypharrgate_nginx_test.rc == 0
  changed_when: false
  failed_when: false

- name: Avertissement si la configuration nginx est invalide
  ansible.builtin.debug:
    msg: >-
      Configuration nginx de {{ pgrole }} invalide :
      {{ decypharrgate_nginx_test.stderr | default('') }}
  when: decypharrgate_nginx_test.rc != 0

- name: Lire l'etat de {{ pgrole }}
  ansible.builtin.command:
    argv:
      - python3
      - "{{ settings.source }}/includes/config/scripts/decypharrgate.py"
      - status
      - --gate
      - "{{ pgrole }}"
  register: decypharrgate_status_raw
  changed_when: false
  failed_when: false

- name: Analyser l'etat de {{ pgrole }}
  ansible.builtin.set_fact:
    decypharrgate_status: "{{ decypharrgate_status_raw.stdout | from_json }}"
  when:
    - decypharrgate_status_raw.rc == 0
    - decypharrgate_status_raw.stdout | default('') | trim | length > 0

- name: Avertissement si l'etat est indisponible
  ansible.builtin.debug:
    msg: >-
      Etat de {{ pgrole }} indisponible. Verifier le conteneur puis relancer
      l'option de menu « Cache gate Decypharr ».
  when: decypharrgate_status is not defined

- name: Proposer de configurer les Sonarr v5+ eligibles
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id":"decypharrgate.configure_sonarr","label":"Configurer les Sonarr v5+ eligibles ?","kind":"confirm","secret":false}
      Sonarr detectes :
      {% for arr in decypharrgate_status.sonarrs | default([]) if arr.state in ['eligible', 'configured'] %}
      - {{ arr.name }} {{ arr.version }} ({{ arr.client_host }})
      {% endfor %}
      Repondre o (oui) ou n (non). Entree = oui.
  register: decypharrgate_sonarr_answer
  when:
    - decypharrgate_status is defined
    - decypharrgate_status.sonarrs | default([]) | selectattr('state', 'equalto', 'eligible') | list | length > 0

- name: Configurer les Sonarr eligibles
  ansible.builtin.command:
    argv:
      - python3
      - "{{ settings.source }}/includes/config/scripts/decypharrgate.py"
      - configure
      - --gate
      - "{{ pgrole }}"
  register: decypharrgate_configure_result
  changed_when: "'-> ' in (decypharrgate_configure_result.stdout | default(''))"
  failed_when: false
  when:
    - decypharrgate_sonarr_answer is defined
    - not (decypharrgate_sonarr_answer.skipped | default(false))
    - (decypharrgate_sonarr_answer.user_input | default('')) | lower in ['', 'o', 'oui', 'y', 'yes']

- name: Afficher le resultat de la configuration
  ansible.builtin.debug:
    var: decypharrgate_configure_result.stdout_lines
  when:
    - decypharrgate_configure_result is defined
    - not (decypharrgate_configure_result.skipped | default(false))

- name: Proposer d'augmenter le cache DFS
  ansible.builtin.pause:
    prompt: |
      SSDV2_PROMPT {"id":"decypharrgate.increase_cache","label":"Passer le cache DFS de l'upstream a 20 Go ?","kind":"confirm","secret":false}
      Upstream : {{ decypharrgate_status.upstream | default('inconnu') }}
      Un backup de config.json sera cree, puis l'instance sera redemarree.
      Recommande si les logs contiennent « disk limit reached ».
      Repondre o (oui) ou n (non). Entree = non.
  register: decypharrgate_cache_answer
  when:
    - decypharrgate_status is defined
    - decypharrgate_status.cache_size | default('') == '500MB'

- name: Augmenter le cache DFS
  ansible.builtin.command:
    argv:
      - python3
      - "{{ settings.source }}/includes/config/scripts/decypharrgate.py"
      - increase-cache
      - --upstream
      - "{{ decypharrgate_status.upstream }}"
  register: decypharrgate_cache_result
  changed_when: "'-> 20GB' in (decypharrgate_cache_result.stdout | default(''))"
  failed_when: false
  when:
    - decypharrgate_cache_answer is defined
    - not (decypharrgate_cache_answer.skipped | default(false))
    - (decypharrgate_cache_answer.user_input | default('n')) | lower in ['o', 'oui', 'y', 'yes']

- name: Afficher le resultat du cache DFS
  ansible.builtin.debug:
    var: decypharrgate_cache_result.stdout_lines
  when:
    - decypharrgate_cache_result is defined
    - not (decypharrgate_cache_result.skipped | default(false))

- name: Resume de {{ pgrole }}
  ansible.builtin.debug:
    msg:
      - "Gate           : {{ decypharrgate_status.gate | default(pgrole) }} ({{ decypharrgate_status.health | default('inconnu') }})"
      - "Upstream       : {{ decypharrgate_status.upstream | default('inconnu') }}"
      - "Cache DFS      : {{ decypharrgate_status.cache_size | default('inconnu') }}"
      - "Sonarr v5+     : {{ decypharrgate_status.sonarrs | default([]) | map(attribute='name') | join(', ') or 'aucun' }}"
      - "Non concernes  : {{ decypharrgate_status.skipped | default([]) | map(attribute='name') | join(', ') or 'aucun' }}"
  when: decypharrgate_status is defined
