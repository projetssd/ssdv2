---
- name: 'Stop {{ pgrole }}'
  docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: '{{ pgrole }}'
    state: stopped

- name: Launch postgresql
  include_tasks: "{{ settings.source }}/includes/dockerapps/templates/generique/hsqldb.yml"

- name: 'Deploying {{pgrole}}'
  docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: '{{ pgrole }}'
    state: started

