---
- name: 'Stop {{ pgrole }}'
  docker_container:
    labels:
      ssdv2.app: "{{pgrole}}"
    name: '{{ pgrole }}'
    state: stopped

- name: Create directory
  file:
    path: "/home/{{ lookup('env','USER') }}/local/{{pgrole}}"
    state: directory

- name: 'Deploying {{pgrole}}'
  docker_container: "{{ docker_info }}"
